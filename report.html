<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>블라인드 테스트 보고서 · 페르마 수학학원</title>
<meta property="og:title" content="블라인드 테스트 보고서">
<meta property="og:description" content="페르마 수학학원 블라인드 테스트 결과">
<meta property="og:image" content="https://fermat-math.github.io/blindtest/assets/report-card.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
:root{--blue:#1ea7ff;--org:#ff8a00;--ink:#222;--gray:#888;--line:#ececec;--bg:#f3f5f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,-apple-system,sans-serif;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:18px;margin-top:12px;position:relative;overflow:hidden}
.strip{height:8px;background:var(--blue);margin:-18px -18px 14px}
.brand{display:flex;justify-content:space-between;align-items:center}
.brand .t{font-size:12px;letter-spacing:.5px;color:#333}.brand img{height:40px}
.big{font-weight:300;font-size:44px;line-height:.95;letter-spacing:-1px;background:linear-gradient(180deg,#1666a8,#1ea7ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin:14px 0 12px}
.who b{font-size:24px;font-weight:500;display:block}.who span{display:block;color:#555;font-size:13px}
.stamp{position:absolute;right:16px;top:86px;width:84px;height:84px;border:3px solid #c8302b;border-radius:50%;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px #c8302b;color:#c8302b;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-14deg);opacity:.9}
.stamp b{font-size:24px;font-weight:900;letter-spacing:2px;line-height:1}.stamp small{font-size:10px;font-weight:700;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:#f7f9fb;border-radius:12px;padding:10px 6px;text-align:center}
.stat span{display:block;font-size:11px;color:var(--gray)}.stat b{display:block;font-size:30px;font-weight:400;line-height:1.15;color:var(--blue)}.stat b small{font-size:12px;margin-left:1px}
.stat.o b{color:var(--org)}.stat.g b{color:#333;font-size:22px;line-height:1.6}
.msg{margin:14px 0 0;font-size:14px;color:#333}.msg b{color:var(--blue)}
h2{margin:0 0 10px;font-size:17px}h2 small{font-weight:400;color:var(--gray);font-size:12px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.q{border-radius:10px;padding:6px 0 5px;text-align:center;background:#eaf6ff;color:#0f6fb0;font-weight:700;font-size:15px;line-height:1.1}
.q small{display:block;font-size:10px;font-weight:500;opacity:.8;margin-top:2px}
.q.x{background:#fff1e3;color:#d86f00;outline:2px solid #ffb25c}
.legend{display:flex;gap:12px;font-size:12px;color:#666;margin-top:10px;flex-wrap:wrap}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
svg{width:100%;height:auto;display:block}
.rounds{margin-top:6px;border-top:1px solid var(--line)}
.round{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.round>b{color:var(--blue);min-width:30px}.round .tm{color:#777}.round .tags{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#fff1e3;color:#d86f00}.tag.ok{background:#eaf6ff;color:#0f6fb0}
.w{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.w-h{display:flex;gap:8px;align-items:center}.w-h .n{flex:none;background:var(--org);color:#fff;font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}.w-h b{font-size:15px}
.r{margin-top:8px;padding-top:8px;border-top:1px dashed #e3e3e3}.r .h{font-size:13px;color:#555}.r .h s{color:#c0392b;text-decoration:line-through;font-weight:700}.r .ty{font-size:11px;font-weight:700;color:#c0392b;background:#fdecea;border-radius:999px;padding:1px 7px;margin-left:4px}
.r p{margin:3px 0 0;font-size:14px}
.tip{margin-top:8px;background:#f2f9ff;border-radius:8px;padding:8px 10px;font-size:13px}.tip b{color:var(--blue);display:block;font-size:12px}
.tally{display:flex;flex-direction:column;gap:6px}.tr{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;font-size:13px}.tr i{display:block;height:10px;border-radius:5px;background:var(--blue)}.tr .bar{background:#eef1f4;border-radius:5px}
.foot{text-align:center;font-size:12px;color:#888;margin-top:16px}.foot a{display:inline-block;margin-top:8px;background:#13283b;color:#fff;text-decoration:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px}
.err{text-align:center;padding:40px 16px;color:#666}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card err">보고서를 여는 중…</div></div>
<script>
(async function(){
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dur=s=>{s=Math.max(0,Math.round(s||0));const m=Math.floor(s/60),h=Math.floor(m/60);return h?`${h}시간 ${m%60}분`:m?`${m}분`:`${s}초`};
const tm=t=>{if(!t)return '';const d=new Date(t);const w='일월화수목금토'[d.getDay()];return `${d.getMonth()+1}.${d.getDate()}(${w}) ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const b64d=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
let D=null;
try{const h=location.hash.slice(1);const m=h.match(/^d=([zj])(.+)$/);
  if(m){const bytes=b64d(m[2]);let txt;
    if(m[1]==='z'){const ds=new DecompressionStream('deflate-raw');txt=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text()}
    else txt=new TextDecoder().decode(bytes);
    D=JSON.parse(txt)}}catch(e){D=null}
if(!D){app.innerHTML='<div class="card err">보고서 정보를 읽지 못했어요.<br>카카오톡에서 받은 링크를 다시 눌러 주세요.</div>';return}
let CC={};try{CC=(await(await fetch('exams/concepts.json')).json())[D.e]||{}}catch(e){}
const N=D.N||CC.n||25,st=D.st||CC.start||1,att=D.a.map(a=>({t:a[0],s:a[1],w:a[2]||[]}));
const cn=q=>(CC.concepts||[])[q-st]||'';
const ever=[...new Set(att.flatMap(a=>a.w))].sort((a,b)=>a-b);
const first=Math.round((N-att[0].w.length)/N*100);
const fixedAt=q=>{let l=-1;att.forEach((a,i)=>{if(a.w.includes(q))l=i});return l+2};
const dd=new Date(D.d);
document.title=`${D.n} · ${D.t} 보고서`;
/* 회차별 정답률 */
const pts=att.map(a=>Math.round((N-a.w.length)/N*100)),lo=Math.max(0,Math.floor((Math.min(...pts)-10)/10)*10);
const W=340,H=170,L=30,R=18,T=22,B=28,px=i=>att.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(att.length-1),py=v=>T+(100-v)/(100-lo||1)*(H-T-B);
const chart=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="회차별 정답률">${[0,1,2,3,4].map(k=>{const v=Math.round(lo+(100-lo)*k/4);return `<line x1="${L}" x2="${W-R}" y1="${py(v)}" y2="${py(v)}" stroke="#eee"/><text x="${L-6}" y="${py(v)+4}" text-anchor="end" font-size="10" fill="#aaa">${v}</text>`}).join('')}
<polyline fill="none" stroke="#1ea7ff" stroke-width="2.5" points="${pts.map((v,i)=>`${px(i)},${py(v)}`).join(' ')}"/>${pts.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v)}" r="4" fill="#1ea7ff"/><text x="${px(i)}" y="${py(v)-9}" text-anchor="middle" font-size="11" font-weight="700" fill="#1ea7ff">${v}%</text><text x="${px(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#666">${i+1}차</text>`).join('')}</svg>`;
const tally={};Object.values(D.w||{}).forEach(x=>(x.r||[]).forEach(r=>{if(r[2])tally[r[2]]=(tally[r[2]]||0)+1}));
const tk=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
app.innerHTML=`
<div class="card"><div class="strip"></div>
  <div class="brand"><span class="t">${dd.getFullYear()}/${pad(dd.getMonth()+1)}/${pad(dd.getDate())} · one report</span><img src="assets/fermat-logo.png" alt="페르마 수학학원"></div>
  <div class="big">ONE<br>REPORT</div>
  <div class="stamp" aria-label="통과"><b>통과</b><small>${dd.getMonth()+1}.${dd.getDate()}</small></div>
  <div class="who"><b>${esc(D.n)}</b><span>${esc(D.c||'')}</span><span>${esc(D.t)}</span></div>
  <div class="stats"><div class="stat"><span>첫 채점 점수</span><b>${first}<small>점</small></b></div><div class="stat o"><span>채점 횟수</span><b>${att.length}<small>회</small></b></div><div class="stat g"><span>실제로 푼 시간</span><b>${dur(D.sp)}</b></div></div>
  <p class="msg"><b>다 맞았어요!</b> ${ever.length?`처음에 틀렸던 ${ever.length}문제를 스스로 다시 검토해서 모두 고쳤어요.`:'한 번에 모두 맞혔어요.'}</p>
</div>
<div class="card"><h2>한눈에 보기<small>${N}문항</small></h2>
  <div class="grid">${Array.from({length:N},(_,k)=>{const q=st+k,w=ever.includes(q);return `<div class="q${w?' x':''}">${q}${w?`<small>${fixedAt(q)}차에 고침</small>`:'<small>1차 정답</small>'}</div>`}).join('')}</div>
  <div class="legend"><span><i style="background:#eaf6ff"></i>한 번에 맞힘</span><span><i style="background:#fff1e3;outline:2px solid #ffb25c"></i>틀렸다가 고침</span></div>
</div>
<div class="card"><h2>회차별 정답률</h2>${chart}
  <div class="rounds">${att.map((a,i)=>`<div class="round"><b>${i+1}차</b><span class="tm">${tm(a.t)}</span><span class="tags">${a.w.length?a.w.map(q=>`<span class="tag">${q}번</span>`).join(''):'<span class="tag ok">모두 정답</span>'}</span></div>`).join('')}</div>
</div>
${tk.length?`<div class="card"><h2>실수 유형</h2><div class="tally">${tk.map(([k,v])=>`<div class="tr"><span>${esc(k)}</span><span class="bar"><i style="width:${Math.round(v/tk[0][1]*100)}%"></i></span><b>${v}번</b></div>`).join('')}</div></div>`:''}
${ever.length?`<div class="card"><h2>틀렸던 문제와 이유</h2>${ever.map(q=>{const x=(D.w||{})[q]||{};return `<div class="w"><div class="w-h"><span class="n">${q}번</span><b>${esc(cn(q))}</b></div>
  ${(x.r||[]).map(r=>`<div class="r"><div class="h">${r[0]}차 · 내 답 <s>${esc(r[1]||'빈칸')}</s>${r[2]?`<span class="ty">${esc(r[2])}</span>`:''}</div>${r[3]?`<p>${esc(r[3])}</p>`:''}</div>`).join('')||`<div class="r"><p>${(()=>{const rs=[];att.forEach((a,i)=>{if(a.w.includes(q))rs.push(i+1)});return rs.join('·')+'차에 틀렸다가 '+(rs[rs.length-1]+1)+'차에 고쳤어요.'})()}</p></div>`}
  ${x.tp?`<div class="tip"><b>다음에 검토할 때</b>${esc(x.tp)}</div>`:''}</div>`}).join('')}</div>`:''}
<div class="foot">페르마 수학학원 · 블라인드 테스트<br>틀린 개수를 알려 주지 않고, 스스로 처음부터 다시 검토해서 모두 맞힐 때까지 푸는 방식이에요.<br><a href="./">시험 대비 열기</a></div>`;
})();
</script>
</body>
</html>
