<script id="main-script">
(function(){
const STATE = JSON.parse(document.getElementById('state').textContent);
const app = document.getElementById('app');
const LS = 'dabogi.v1';
let prog = {}; try{ prog = JSON.parse(localStorage.getItem(LS)||'{}')||{} }catch(e){ prog={} }
const saveProg=()=>{ try{ localStorage.setItem(LS, JSON.stringify(prog)) }catch(e){} };
let view = {mode:'student', exam:null};
let canTeach=false, artifactNs=null, autoOpened=false;
const CHECKS=['문제를 처음부터 다시 소리 내듯 천천히 읽었다','조건(정수, 자연수, 단위, ~가 아닌 것)에 밑줄을 쳤다','계산을 거꾸로 대입해서 맞는지 확인했다','답안지에 옮겨 적은 답이 풀이와 같은지 확인했다'];

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFKC').replace(/[−–]/g,'-').replace(/\s+/g,'').toLowerCase();
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const hashOf=(salt,i,v)=>sha(salt+':'+i+':'+norm(v));
/* 주관식: 단위를 안 써도(또는 써도) 정답 처리 */
const UNITS=['cm2','cm3','mm2','mm3','km2','m2','m3','cm','mm','km','kg','ml','m','g','l','%','°','도','개월','가지','시간','마리','송이','켤레','자루','조각','경기','개','명','번','회','원','배','장','쌍','권','살','분','초','점','일','년','쪽','줄','대','채','층','칸','곳','팀','통','병','잔','벌','시','주'];
function unitless(v){const n=norm(v);for(const u of UNITS)if(n.length>u.length&&n.endsWith(u)&&/[0-9π)\]}a-z]$/.test(n.slice(0,-u.length))&&!(/[a-z]$/.test(n.slice(0,-u.length))&&/^[a-z]/.test(u)))return n.slice(0,-u.length);return n}
async function matchAns(ex,i,v){const hs=ex.hashes[i];const n=norm(v);if(!n)return null;
  const tryV=async c=>{const hv=await hashOf(ex.salt,i,c);const j=hs.indexOf(hv);return j<0?null:{v:c,j}};
  let r=await tryV(n);if(r)return r;
  const t=qtypes(ex)[i];if(t&&t!=='sa')return null;
  const b=unitless(n);if(b!==n){r=await tryV(b);if(r)return r;return null}
  for(const u of UNITS){r=await tryV(b+u);if(r)return r}
  return null}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const h=(html)=>{const d=document.createElement('div');d.innerHTML=html;return d.firstElementChild};
const myName=()=>prog._me?prog._me.name:(prog._name||'');
/* 학년: 반 이름 앞 숫자(7→중1, 8→중2, 9→중3). 시험에는 grade(7/8/9)를 붙여 둔다. */
const gradeOf=c=>{const m=String(c||'').match(/^\s*(\d)/);return m?+m[1]:null};
const GRADE_LABEL=g=>g>=7&&g<=9?`중${g-6}`:g>=1&&g<=6?`초${g}`:g>=10&&g<=12?`고${g-9}`:'';
const myGrade=()=>prog._me?gradeOf(prog._me.cls):null;
const examVisible=ex=>{const k=prog._me?prog._me.cls+'|'+prog._me.name:'';
  if(ex.who&&ex.who.length)return !k||ex.who.includes(k);   /* 특정 학생에게만 보이는 시험 */
  if(k&&ex.hideFor&&ex.hideFor.includes(k))return false;     /* 특정 학생에게는 안 보이는 시험 */
  return !ex.grade||!myGrade()||ex.grade===myGrade()};

/* ---------- study log: only on hosted student pages that carry STATE.endpoint ---------- */
const EP=STATE.endpoint||'';
const PICK=EP||(Array.isArray(STATE.roster)&&STATE.roster.length>0);
const QKEY='dabogi.queue';
let queue=[];try{queue=JSON.parse(localStorage.getItem(QKEY)||'[]')||[]}catch(e){queue=[]}
const saveQ=()=>{try{localStorage.setItem(QKEY,JSON.stringify(queue.slice(-300)))}catch(e){}};
const device=(()=>{try{let d=localStorage.getItem('dabogi.dev');if(!d){d=Math.random().toString(36).slice(2,10);localStorage.setItem('dabogi.dev',d)}return d}catch(e){return 'x'}})();
let flushing=false;
async function flush(){if(!EP||flushing||!queue.length)return;flushing=true;
  try{while(queue.length){const batch=queue.slice(0,5);const r=await fetch(EP+'?action=log&d='+encodeURIComponent(JSON.stringify(batch)));const j=await r.json();if(!j||!j.results)break;queue.splice(0,batch.length);saveQ()}}catch(e){}
  flushing=false}
const sess={id:null,ex:null,active:0,visSince:0,base:0};
const activeMs=()=>sess.active+(sess.visSince?Date.now()-sess.visSince:0);
const runSec=()=>Math.round(sess.base+activeMs()/1000);
function evBase(ev,ex){return {ev,cls:prog._me.cls,name:prog._me.name,examId:ex.id,examTitle:ex.title,total:ex.hashes.length,at:Date.now(),session:sess.id,device,activeSec:Math.round(activeMs()/1000)}}
/* 학생별 기록: 한 기기를 여러 학생이 써도 섞이지 않게, 다른 기기에서 통과한 시험도 보이게 */
const ukey=m=>m?m.cls+'|'+m.name:'';
function stashUser(){const k=ukey(prog._me);if(!k)return;const d={};for(const x of Object.keys(prog))if(x!=='_me'&&x!=='_users'&&x!=='_name'){d[x]=prog[x];delete prog[x]}(prog._users=prog._users||{})[k]=d}
function setMe(m){stashUser();if(m){prog._me=m;const k=ukey(m),d=prog._users&&prog._users[k];if(d){Object.assign(prog,d);delete prog._users[k]}}else delete prog._me;saveProg();synced=null}
let synced=null;
function remotePr(ex,r){let x={};try{x=JSON.parse(r.extra||'{}')||{}}catch(e){}const st=ex.start||1;
  const atts=(x.attempts||[]).map(a=>({w:(a.w||[]).map(q=>q-st),a:{},t:a.t,s:a.s}));if(!atts.length)atts.push({w:[],a:{},t:r.at,s:x.runSec});
  return {answers:Array((ex.hashes||[]).length||ex.n||0).fill(''),attempts:atts,start:x.startedAt||r.at,done:r.at,spent:x.runSec||atts[atts.length-1].s||0,remote:true,reported:true}}
function srvDone(ex){const r=prog._srv&&prog._srv[ex.id];if(!r)return null;const h=(prog._hist&&prog._hist[ex.id])||[];if(h.some(x=>x.done&&r.at<=x.done+60000))return null;return r}
async function syncPass(){if(!EP||!prog._me||STATE.teacherView)return;const k=ukey(prog._me);if(synced===k)return;synced=k;
  try{const j=await(await fetch(EP+'?action=mine&cls='+encodeURIComponent(prog._me.cls)+'&name='+encodeURIComponent(prog._me.name))).json();
    if(!j||!j.ok||!j.passed||ukey(prog._me)!==k)return;
    const before=JSON.stringify(prog._srv||{});prog._srv=j.passed;saveProg();
    if(JSON.stringify(j.passed)!==before&&STATE.exams.some(ex=>!(prog[ex.id]&&prog[ex.id].done)&&srvDone(ex))&&!document.querySelector('.ans input:focus'))render()}catch(e){}}
function logEv(ev,ex,extra){if(!EP||!prog._me)return;queue.push(Object.assign(evBase(ev,ex),extra||{}));saveQ();flush()}
function beacon(ev,ex){if(!EP||!prog._me||!sess.id)return;const d=JSON.stringify([evBase(ev,ex)]);
  try{if(navigator.sendBeacon&&navigator.sendBeacon(EP,new Blob([d],{type:'text/plain'})))return}catch(e){}
  queue.push(JSON.parse(d)[0]);saveQ()}
function persistSpent(){if(sess.ex&&prog[sess.ex.id]){prog[sess.ex.id].spent=runSec();saveProg()}}
function sessStart(ex){if(sess.ex===ex)return;sessEnd();const pr=prog[ex.id];
  sess.id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);sess.ex=ex;sess.active=0;sess.base=(pr&&pr.spent)||0;
  sess.visSince=document.visibilityState==='visible'?Date.now():0;logEv('start',ex)}
function sessEnd(){if(!sess.ex)return;persistSpent();logEv('leave',sess.ex);sess.ex=null;sess.id=null}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(!sess.ex)return;
  if(document.visibilityState==='hidden'){sess.active+=sess.visSince?Date.now()-sess.visSince:0;sess.visSince=0;hiddenAt=Date.now();persistSpent();beacon('pause',sess.ex)}
  else{if(Date.now()-hiddenAt>30*60000){const ex=sess.ex;sess.ex=null;sess.id=null;sessStart(ex)}else sess.visSince=Date.now();flush()}});
window.addEventListener('pagehide',()=>{if(sess.ex){persistSpent();beacon('pause',sess.ex)}});
window.addEventListener('online',flush);
const fmtDur=sec=>{sec=Math.max(0,Math.round(sec||0));const m=Math.floor(sec/60),hh=Math.floor(m/60);return hh?`${hh}시간 ${m%60}분`:m?`${m}분`:`${sec}초`};
const fmtTime=t=>new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'});

function render(){
  setTimeout(syncPass,0);
  app.innerHTML='';
  const head=h(`<header class="top"><div class="note" aria-hidden="true">x<sup>n</sup>+y<sup>n</sup>=z<sup>n</sup></div><div><span class="acad">페르마 수학학원</span>${STATE.hub?'<h1>시험 <em>대비</em></h1>':'<h1>블라인드 <em>테스트</em></h1>'}<p class="sub">${view.mode==='teacher'?'시험을 올리면 학생들이 이 링크에서 직접 채점해요.':STATE.hub?'블라인드 테스트로 실수를 스스로 찾고, 오답노트로 틀린 문제를 다시 풀어요.':'몇 번이 틀렸는지는 가려져 있어요. 처음부터 다시 보면서 스스로 찾아요.'}</p></div></header>`);
  if(canTeach){const tb=h(`<div class="tabs" role="group"><button data-m="student" aria-pressed="${view.mode==='student'}">학생 화면</button><button data-m="teacher" aria-pressed="${view.mode==='teacher'}">선생님</button></div>`);
    tb.onclick=e=>{const m=e.target.dataset.m;if(m){view={mode:m,exam:null};render()}};head.appendChild(tb)}
  app.appendChild(head);
  if(view.mode==='teacher') return renderTeacher();
  if(!view.exam&&!autoOpened&&STATE.studentOnly&&!STATE.hub&&STATE.exams.length===1&&prog._me){autoOpened=true;view.exam=STATE.exams[0].id}
  if(view.exam) return renderExam(STATE.exams.find(x=>x.id===view.exam));

function sendNote(book,note){if(!EP||!prog._me)return;

const qn=(ex,i)=>(ex.start||1)+i;
const stamp=t=>{const d=t?new Date(t):null;return `<div class="stamp" aria-label="통과"><b>통과</b>${d?`<small>${d.getMonth()+1}.${d.getDate()}</small>`:''}</div>`};
const CIRC=['','①','②','③','④','⑤'];
/* Question types: stored by the teacher page; for older exams, a pair of identical hashes means "③|3" (multiple choice). */
function qtypes(ex){if(Array.isArray(ex.types)&&ex.types.length===ex.hashes.length)return ex.types;
  return ex.hashes.map(h=>h.length>=2&&h.every(x=>x===h[0])?'mc':'sa')}
function keyTypes(key){return key.map(k=>{const alt=k.split('|')[0];const c=(alt.match(/[①②③④⑤]/g)||[]).length;return c>=2?'mcm':c===1||/^\s*[1-5]\s*\|\s*[①②③④⑤]\s*$/.test(k)?'mc':'sa'})}
/* Multiple-answer choice keys are stored as sorted digits "2,4", which is what the student's buttons produce */
function mcmCanon(a){const d=[...new Set((String(a).normalize('NFKC').match(/[1-5]/g)||[]))].sort();return d.join(',')}
const TYPE_LABEL={sa:'주관식',mc:'객관식',mcm:'복수 정답'};
/* [label, text inserted, aria name, caret steps back] */
const MKEYS=[['a/b','/','분수'],['x²','^2','제곱'],['xⁿ','^','거듭제곱'],['√','√','루트'],['( )','()','괄호',1],['−','-','빼기'],['π','π','파이'],['±','±','플러스마이너스'],['x','x','x'],['y','y','y'],['a','a','a'],['≤','≤','작거나 같다'],['≥','≥','크거나 같다'],['°','°','도'],[':',':','비 (쌍점)'],[',',',','쉼표'],['⌫','⌫','지우기']];
function mathInner(t){return t.replace(/√\(([^()]*)\)/g,'√<span class="rt">$1</span>').replace(/√([0-9a-zπ.]+)/gi,'√<span class="rt">$1</span>')
  .replace(/\^\(([^()]*)\)/g,'<sup>$1</sup>').replace(/\^(-?[0-9a-zπ]+)/gi,'<sup>$1</sup>')}
function mathView(v){let t=esc(String(v||''));if(!t)return '';
  const OP='(\\([^()]+\\)|√?[0-9a-zπ.]+(?:\\^-?[0-9a-z]+)?)';const strip=x=>/^\(.*\)$/.test(x)?x.slice(1,-1):x;
  t=t.replace(new RegExp(OP+'/'+OP,'gi'),(m,p,q)=>`<span class="frac"><span>${mathInner(strip(p))}</span><span>${mathInner(strip(q))}</span></span>`);
  return mathInner(t).replace(/-/g,'−')}
function renderWho(){

    cs.onchange=fill;ns.onchange=()=>{ok.disabled=!ns.value};fill();

    app.appendChild(p);return}
  const p=h(`<section class="panel"><div class="krow"><div class="field"><label class="label" for="wcls">반</label><input type="text" id="wcls" placeholder="예: 2-1" autocomplete="off"></div><div class="field" style="flex:2 1 160px"><label class="label" for="wname">이름</label><input type="text" id="wname" placeholder="예: 김민준" autocomplete="off"></div></div><div class="row"><button class="btn" id="wok">확인</button><span class="hint" id="wmsg">선생님 명단에 있는 반과 이름을 적어요.</span></div></section>`);

      if(r.ok){setMe({cls:r.cls,name:r.name});render();return}
      msg.textContent=r.error==='empty_roster'?'선생님이 아직 명단을 등록하지 않았어요.':'명단에 없는 이름이에요. 반과 이름을 다시 확인해 주세요.'}

  p.querySelector('#wok').onclick=go;p.querySelector('#wname').onkeydown=e=>{if(e.key==='Enter')go()};

/* Wait before the next grading: 5 min after the 1st and 2nd, then 10, 15, 20… (5 more each time) */
const waitMin=n=>n<=2?5:(n-1)*5;
let waitTimer=null;
function showVerdict(ex,pr,vbox,gbtn,grid,at){

  const cw=v.querySelector('.checks');
  CHECKS.forEach((c,i)=>{const l=h(`<label class="check"><input type="checkbox" id="c${i}" ${pr.checked.includes(i)?'checked':''}><span>${c}</span></label>`);
    l.querySelector('input').onchange=e=>{pr.checked=pr.checked.filter(x=>x!==i);if(e.target.checked)pr.checked.push(i);saveProg();upd()};cw.appendChild(l)});
  v.querySelector('.log').innerHTML=pr.attempts.map((a,i)=>`<b>${i+1}차 다시 확인</b>`).join('');
  vbox.innerHTML='';vbox.appendChild(v);
  const total=until-at.t,wt=v.querySelector('.wait-t'),wb=v.querySelector('.wait-bar i'),wbox=v.querySelector('#wait');
  const upd=()=>{const left=until-Date.now(),checked=pr.checked.length===CHECKS.length;
    if(left>0){const m=Math.floor(left/60000),sec=Math.floor(left%60000/1000);wt.textContent=`다음 채점까지 ${m}:${String(sec).padStart(2,'0')}`;wb.style.width=Math.round((1-left/total)*100)+'%';
      gbtn.disabled=true;gbtn.textContent=`${m}분 ${String(sec).padStart(2,'0')}초 뒤에 채점할 수 있어요`}
    else{clearInterval(waitTimer);wbox.hidden=true;gbtn.disabled=!checked;gbtn.textContent=checked?`${pr.attempts.length+1}차 채점하기`:'검토를 모두 체크해야 다시 채점할 수 있어요'}};
  upd();if(until>Date.now())waitTimer=setInterval(()=>{if(!document.body.contains(gbtn)){clearInterval(waitTimer);return}upd()},1000);
}

/* ---------- crypto for the locked AI analysis ---------- */
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=s=>new Uint8Array(s.match(/../g).map(x=>parseInt(x,16)));
const b64=b=>{let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const xor=(a,b)=>a.map((x,i)=>x^b[i]);
async function kdf(salt,i,v){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('k|'+salt+'|'+i+'|'+norm(v))))}
async function lockAnalysis(salt,alts,obj){
  const master=crypto.getRandomValues(new Uint8Array(32));
  const shares=alts.map(()=>crypto.getRandomValues(new Uint8Array(32)));
  shares[shares.length-1]=shares.slice(0,-1).reduce((acc,s)=>xor(acc,s),master);
  const wraps=[];for(let i=0;i<alts.length;i++){const w=[];for(const a of alts[i])w.push(hex(xor(shares[i],await kdf(salt,i,a))));wraps.push(w)}
  const key=await crypto.subtle.importKey('raw',master,'AES-GCM',false,['encrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  return {wraps,iv:b64(iv),ct:b64(ct)};
}
async function unlockAnalysis(ex,answers){
  if(!ex.lock)return null;
  try{let master=new Uint8Array(32);
    for(let i=0;i<ex.hashes.length;i++){const m=await matchAns(ex,i,answers[i]);if(!m)return null;
      master=xor(master,xor(unhex(ex.lock.wraps[i][m.j]),await kdf(ex.salt,i,m.v)))}
    const key=await crypto.subtle.importKey('raw',master,'AES-GCM',false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(ex.lock.iv)},key,unb64(ex.lock.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){return null}
}

    }catch(e){otherShare()}};
  const otherShare=async()=>{try{if(navigator.share){await navigator.share({title:'블라인드 테스트 결과',text:shareTxt});return}}catch(e){if(e&&e.name==='AbortError')return}

  c.querySelector('#oshare').onclick=otherShare;

    delete prog[ex.id];saveProg();render();scrollTo(0,0)};

    const good=ex.hashes.map((_,q)=>q).filter(q=>!everWrong.includes(q)&&qmap[q]).slice(-3);
    c.querySelector('#orgood').innerHTML=good.length?good.map(q=>tag(q,'')).join(''):'<p class="or-none">-</p>';
    c.querySelector('#orweak').innerHTML=everWrong.length?everWrong.slice(0,3).map(q=>tag(q,' o')).join(''):'<p class="or-none">틀린 문제가 없어요</p>';
    c.querySelectorAll('.or-cn').forEach(el=>{const A=qmap[+el.dataset.q];el.textContent=A&&A.concept?A.concept:''})};
  unlockAnalysis(ex,pr.answers).then(an=>{
    const qmap={};(an&&an.questions||[]).forEach(q=>qmap[(q.no|0)-(ex.start||1)]=q);

    const tally={};
    everWrong.forEach(q=>{

      const card=h(`<div class="wcard"><div class="row" style="justify-content:space-between"><strong><span class="or-qn o">${qn(ex,q)}번</span> ${A&&A.concept?esc(A.concept):''}</strong><span class="hint">고친 답 ${esc(pr.answers[q])}</span></div>
        ${rows}
        ${A?`${A.solution?`<div class="ablock"><span class="label">바른 풀이</span><div>${esc(A.solution)}</div></div>`:''}${A.tip?`<div class="ablock"><span class="label">다음에 검토할 때</span><div>${esc(A.tip)}</div></div>`:''}`:'<p class="hint" style="margin:0">이 시험에는 AI 분석이 없어요. 선생님과 함께 왜 틀렸는지 확인해 보세요.</p>'}</div>`);
      why.appendChild(card)});
    const ks=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
    if(EP&&!pr.reported){pr.reported=true;saveProg();logEv('report',ex,{attempt:pr.attempts.length,wrong:everWrong.map(q=>qn(ex,q)).join(','),wrongCount:everWrong.length,extra:JSON.stringify({tally,runSec:spent})})}
    if(ks.length){const s=c.querySelector('.summary');s.hidden=false;
      s.innerHTML=`<h3 class="or-t">나의 실수 유형</h3><div class="tally">${ks.map(([k,n])=>`<div class="trow"><span>${esc(k)}</span><span class="tbar"><i style="width:${Math.round(n/ks[0][1]*100)}%"></i></span><b>${n}번</b></div>`).join('')}</div><p class="hint" style="margin:6px 0 0">가장 많은 실수는 <strong>${esc(ks[0][0])}</strong>예요. 다음 시험에서는 이 부분부터 검토하세요.</p>`}
  });
}

let draft={title:'',key:'',images:[],analysis:null,types:{}};
function keyStart(t){const m=String(t||'').trim().match(/^(\d+)\s*[.):\]]/);return m?+m[1]:1}
function parseKey(t){return t.split('\n').map(l=>l.replace(/^\s*\d+\s*[.):\]]\s*/,'').trim()).filter(Boolean)}
function dataUrlToBlob(u){const [m,d]=u.split(',');const type=m.match(/data:([^;]+)/)[1];return new Blob([unb64(d)],{type})}
function analysisPrompt(key,st){st=st||1;
  return `당신은 한국 중학교 수학 교사입니다. 첨부한 이미지는 시험지이고, 아래는 각 문항의 정답입니다(| 는 같은 정답의 다른 표기).
${key.map((k,i)=>`${st+i}번: ${k}`).join('\n')}

각 문항마다 중학생이 실제로 자주 적는 오답을 3~5개 예상하고, 그 오답이 왜 나오는지 분석하세요. 오답은 학생이 답안지에 적을 그대로의 형태로 쓰세요(예: -3, 1/2, ②). 같은 오답의 다른 표기는 | 로 이으세요.
type은 반드시 다음 중 하나: ${TYPES.join(', ')}
reason은 학생에게 직접 말하듯 1~2문장, 풀이의 어느 단계에서 무엇을 잘못했는지 구체적으로.
solution은 핵심 풀이 1~3줄. tip은 이 문제를 검토할 때 확인할 것 한 문장.
이미지에서 문항을 읽을 수 없으면 concept를 "확인 필요"로 쓰고 정답만 보고 추정하세요.

JSON만 출력하세요:
{"questions":[{"no":${st},"concept":"단원/개념 짧게","solution":"...","tip":"...","mistakes":[{"answer":"...","type":"...","reason":"..."}]}]}`;
}

const isPdf=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name);
const mb=arr=>(arr.reduce((n,s)=>n+s.length,0)*0.75/1048576).toFixed(1);
let pdfLib=null;
function loadPdfJs(){if(pdfLib)return pdfLib;const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  pdfLib=new Promise((res,rej)=>{if(window.pdfjsLib)return res(window.pdfjsLib);const sc=document.createElement('script');sc.src=base+'pdf.min.js';
    sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';res(window.pdfjsLib)};sc.onerror=()=>{pdfLib=null;rej(new Error('pdfjs'))};document.head.appendChild(sc)});
  return pdfLib}
async function openPdf(file){const lib=await loadPdfJs();return lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise}
async function pdfToImages(file,onp){const doc=await openPdf(file);const out=[];
  for(let i=1;i<=doc.numPages;i++){onp&&onp(i,doc.numPages);const pg=await doc.getPage(i);const v1=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(2.5,1400/v1.width)});
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:x,viewport:vp}).promise;out.push(c.toDataURL('image/jpeg',.72))}
  return out}
/* ---------- answer-key reading (빠른답지) ---------- */
let keySrc=null; // {pages:[{img, text}]} hi-res pages kept in memory only
async function loadKeyFiles(files,onp){const pages=[];
  for(const f of files){
    if(isPdf(f)){const doc=await openPdf(f);
      for(let i=1;i<=doc.numPages;i++){onp&&onp(`${f.name} ${i}/${doc.numPages}쪽 준비 중…`);const pg=await doc.getPage(i);
        const v1=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(4,2600/v1.width)});
        const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
        await pg.render({canvasContext:x,viewport:vp}).promise;
        let text='';try{text=layoutText(await pg.getTextContent(),v1)}catch(e){}
        pages.push({canvas:c,text})}}
    else{const c=await fileToCanvas(f,2600);pages.push({canvas:c,text:''})}}
  return {pages}}
function fileToCanvas(file,maxW){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(2,maxW/im.width);const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);res(c)};im.onerror=rej;im.src=r.result};r.readAsDataURL(file)})}
/* Rebuild the page's text in reading rows, keeping big horizontal gaps as column breaks */
function layoutText(tc,vp){const items=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({s:it.str.trim(),x:it.transform[4],y:vp.height-it.transform[5],w:it.width||0}));
  items.sort((a,b)=>a.y-b.y||a.x-b.x);const rows=[];
  for(const it of items){const r=rows.find(r=>Math.abs(r.y-it.y)<4);if(r)r.items.push(it);else rows.push({y:it.y,items:[it]})}
  return rows.sort((a,b)=>a.y-b.y).map(r=>{r.items.sort((a,b)=>a.x-b.x);let line='',end=null;
    for(const it of r.items){if(end!==null)line+=(it.x-end>18?'   ‖   ':' ');line+=it.s;end=it.x+it.w}return line}).join('\n')}
/* Whole page + 2x2 overlapping zoomed tiles, so small print survives downsizing */
function pageImages(c,maxCount){const out=[c];if(maxCount>=5){const W=c.width,H=c.height,ov=0.08;
  for(const [cx,cy] of [[0,0],[1,0],[0,1],[1,1]]){const x0=Math.max(0,Math.round(W*(cx*0.5-ov))),y0=Math.max(0,Math.round(H*(cy*0.5-ov)));
    const w=Math.min(W-x0,Math.round(W*(0.5+ov))),h=Math.min(H-y0,Math.round(H*(0.5+ov)));
    const t=document.createElement('canvas');t.width=w;t.height=h;t.getContext('2d').drawImage(c,x0,y0,w,h,0,0,w,h);out.push(t)}}
  return out}
const canvasBlob=c=>new Promise(r=>c.toBlob(b=>r(b),'image/png'));
function parseRange(s){const m=String(s||'').replace(/\s/g,'').match(/^(\d+)(?:[-~](\d+))?$/);if(!m)return null;const a=+m[1],b=m[2]?+m[2]:a;return a<=b?[a,b]:[b,a]}
function keyPrompt2(pageNo,text,range,unit,tiles){return `첨부한 이미지는 한국 중학교 수학 문제집·시험지의 "빠른 정답"(빠른답지) ${pageNo}쪽입니다.${tiles?` 첫 번째 이미지는 쪽 전체이고, 나머지 4장은 같은 쪽을 왼쪽 위·오른쪽 위·왼쪽 아래·오른쪽 아래로 확대한 조각입니다(조각끼리 조금 겹칩니다). 작은 글씨는 확대 조각에서 읽고, 위치와 단 순서는 전체 이미지로 확인하세요.`:''}

빠른답지는 보통 여러 단으로 "번호 답" 칸이 빽빽하게 이어집니다. 번호와 답을 헷갈리지 않게 칸 하나씩 읽으세요.
${unit?`이 쪽에 여러 단원이 있으면 "${unit}" 부분만 읽으세요.\n`:''}${range?`문항 번호 ${range[0]}번부터 ${range[1]}번까지만 필요합니다. 이 범위 밖은 출력하지 마세요.\n`:''}
규칙:
- 최종 답만 씁니다. 풀이는 빼요.
- 객관식 동그라미 숫자는 숫자와 함께: ③|3. 답이 두 개인 객관식은 "②,④" 그대로.
- 분수 a/b, 음수 -3, 거듭제곱 x^2, 루트 √2 처럼 씁니다. 같은 답의 다른 표기는 | 로 잇습니다 (1/2|0.5, x=6|6).
- 글씨가 흐리거나 확실하지 않으면 sure를 false로.
- 답이 문장·그림·서술형이라 한 줄로 정해지지 않으면 answer를 "서술형", sure를 false로.
${text.trim()?`\n이 쪽의 PDF 글자입니다(글자 자체는 정확함, ‖ 는 단·칸 경계). 이미지와 맞춰 보며 우선 활용하세요:\n${text.slice(0,12000)}\n`:''}
JSON만 출력: {"answers":[{"no":1,"answer":"③|3","sure":true}]}`}

async function readKeyWithAI(opts,onp){
  const sample=await window.claude?.use?.('sample');const lim=sample&&await sample.limits().catch(()=>null);
  if(!lim||!lim.images)throw {code:'no_ai'};
  const got={};const pagesIdx=opts.pages;
  for(let k=0;k<pagesIdx.length;k++){const p=keySrc.pages[pagesIdx[k]];onp(`AI가 ${pagesIdx[k]+1}쪽을 읽는 중… (${k+1}/${pagesIdx.length})`);
    const imgs=pageImages(p.canvas,lim.images.maxCount);const blobs=await Promise.all(imgs.map(canvasBlob));
    const res=await sample.json(keyPrompt2(pagesIdx[k]+1,p.text,opts.range,opts.unit,imgs.length>1),{images:blobs,modelTier:'complex'});
    for(const a of (res&&res.answers)||[]){const n=parseInt(a.no,10);if(!n)continue;if(opts.range&&(n<opts.range[0]||n>opts.range[1]))continue;
      const v=String(a.answer||'').trim();if(!v)continue;if(!got[n]||(!got[n].sure&&a.sure!==false))got[n]={v,sure:a.sure!==false&&v!=='서술형'}}}
  const nums=Object.keys(got).map(Number);if(!nums.length)throw {code:'empty'};
  const [a,b]=opts.range||[Math.min(...nums),Math.max(...nums)];
  const lines=[];let unsure=0,missing=0;
  for(let n=a;n<=b;n++){const g=got[n];if(!g){lines.push('확인 필요 (못 읽음)');missing++}else if(!g.sure){lines.push('확인 필요 '+g.v);unsure++}else lines.push(g.v)}
  return {start:a,lines,unsure,missing}}

function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1400/im.width);const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(file)})}
