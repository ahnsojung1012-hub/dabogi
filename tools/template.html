<title>다시보기 채점실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" id="fonts" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style id="page-style">
/* Layout: a single graph-paper column — exam list, then one exam at a time with a sticky answer sheet. */
:root{
  --paper:#f6f8fb; --sheet:#ffffff; --grid:#e3e9f2; --ink:#1d2433; --muted:#5d6a80;
  --line:#cfd8e6; --blue:#2554c7; --blue-soft:#e6edfc; --red:#c8322a; --red-soft:#fbe9e7;
  --green:#1f7a4d; --green-soft:#e3f4ea;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161f; --sheet:#1a202c; --grid:#1f2633; --ink:#e7ebf3; --muted:#9aa6bb;
  --line:#2e3746; --blue:#7fa2ff; --blue-soft:#1d2a4a; --red:#ff7b70; --red-soft:#3a1f1e;
  --green:#5fd39a; --green-soft:#183326; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161f; --sheet:#1a202c; --grid:#1f2633; --ink:#e7ebf3; --muted:#9aa6bb;
  --line:#2e3746; --blue:#7fa2ff; --blue-soft:#1d2a4a; --red:#ff7b70; --red-soft:#3a1f1e;
  --green:#5fd39a; --green-soft:#183326; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.1;margin:0;letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--red)}
h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
.sub{color:var(--muted);margin:4px 0 0;max-width:60ch}
.tabs{display:flex;gap:4px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:7px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--blue);color:var(--sheet)}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{font-family:var(--f-mono);min-height:200px;resize:vertical;line-height:1.7}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px}
.hint{font-size:13px;color:var(--muted)}
.btn{font:inherit;font-weight:700;border-radius:9px;padding:11px 18px;border:1px solid var(--blue);background:var(--blue);color:var(--sheet);cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--blue)}
.btn.danger{border-color:var(--red);background:none;color:var(--red)}
.btn.small{padding:6px 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.exam-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.exam-card{text-align:left;font:inherit;color:inherit;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.exam-card:hover{border-color:var(--blue)}
.exam-card .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--blue-soft);color:var(--blue)}
.chip.done{background:var(--green-soft);color:var(--green)}
.chip.ex{background:var(--grid);color:var(--muted)}
.exam-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
@media (max-width:760px){.exam-layout{grid-template-columns:minmax(0,1fr)}}
.sheet-imgs{display:flex;flex-direction:column;gap:10px}
.sheet-imgs img{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.noimg{border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
.answers{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.ans-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ans{display:flex;align-items:center;gap:6px}
.ans span{font-family:var(--f-mono);font-size:13px;width:26px;text-align:right;color:var(--muted);flex:none}
.ans input{padding:7px 8px;font-variant-numeric:tabular-nums}
.ans.wrong input{border-color:var(--red);background:var(--red-soft)}
.verdict{border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.verdict.bad{background:var(--red-soft);border:1px solid var(--red)}
.verdict.good{background:var(--green-soft);border:1px solid var(--green)}
.big{font-family:var(--f-display);font-size:30px;line-height:1.1}
.bad .big{color:var(--red)} .good .big{color:var(--green)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--blue)}
.log{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-mono);font-size:13px}
.log b{font-weight:500;padding:2px 8px;border-radius:6px;background:var(--paper);border:1px solid var(--line)}
.log b.z{border-color:var(--green);color:var(--green)}
.cert{border:2px solid var(--green);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px;background:var(--sheet)}
.cert dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.cert dt{color:var(--muted);font-size:13px} .cert dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:96px;object-fit:cover;border:1px solid var(--line);border-radius:6px}
.tlist{display:flex;flex-direction:column}
.titem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.titem:first-child{border-top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:9px;font-weight:500;z-index:20}
.rtable{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rrow{display:flex;gap:12px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}.rrow:first-child{border-top:0}
.rno{font-family:var(--f-mono);font-size:13px;color:var(--muted);width:34px;flex:none}
.rq{display:flex;flex-wrap:wrap;gap:6px}
.qb{font-weight:700;font-size:13px;padding:2px 9px;border-radius:6px;background:var(--red-soft);color:var(--red)}.qb.ok{background:var(--green-soft);color:var(--green)}
.why{display:flex;flex-direction:column;gap:10px}
.wcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.wcard .hint{font-variant-numeric:tabular-nums;min-width:0}
.rsel{display:flex;flex-wrap:wrap;gap:6px}
.rpill{cursor:pointer}.rpill input{position:absolute;opacity:0;pointer-events:none}
.rpill span{display:inline-block;padding:5px 11px;border-radius:99px;border:1px solid var(--line);font-size:13px;background:var(--sheet)}
.rpill input:checked+span{background:var(--blue);border-color:var(--blue);color:var(--sheet)}
.rpill input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.arow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.ans-w{font-family:var(--f-mono);font-weight:500;color:var(--red);text-decoration:line-through;text-decoration-thickness:1px}
.areason{font-size:14px}
.ablock{display:flex;flex-direction:column;gap:2px;font-size:14px}
.chip.warn{background:var(--red-soft);color:var(--red)}
.tally{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px}
.trow b{text-align:right;font-variant-numeric:tabular-nums}
.tbar{height:10px;background:var(--grid);border-radius:99px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--red);border-radius:99px}
.krow{display:flex;gap:10px;flex-wrap:wrap}.krow .field{flex:1 1 120px;min-width:0}
.keypages{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.kp{flex:none;display:flex;flex-direction:column;gap:4px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--paper);font:inherit;font-size:12px;color:var(--muted);cursor:pointer}
.kp:hover{border-color:var(--blue)}.kp img{width:84px;height:112px;object-fit:cover;object-position:top;border-radius:4px;background:#fff}
#kcompare{display:flex;flex-direction:column;gap:8px;margin-top:6px}.kimg{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.back{align-self:flex-start}
@media (prefers-reduced-motion:no-preference){.verdict,.cert{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.98)}to{transform:none}}}
</style>
<main class="wrap" id="app"></main>
<script type="application/json" id="state">__STATE__</script>
<script id="main-script">
(function(){
const STATE = JSON.parse(document.getElementById('state').textContent);
const app = document.getElementById('app');
const LS = 'dabogi.v1';
let prog = {}; try{ prog = JSON.parse(localStorage.getItem(LS)||'{}')||{} }catch(e){ prog={} }
const saveProg=()=>{ try{ localStorage.setItem(LS, JSON.stringify(prog)) }catch(e){} };
let view = {mode:'student', exam:null};
let canTeach=false, artifactNs=null;
const CHECKS=['문제를 처음부터 다시 소리 내듯 천천히 읽었다','조건(정수, 자연수, 단위, ~가 아닌 것)에 밑줄을 쳤다','계산을 거꾸로 대입해서 맞는지 확인했다','답안지에 옮겨 적은 답이 풀이와 같은지 확인했다'];

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFKC').replace(/[−–]/g,'-').replace(/\s+/g,'').toLowerCase();
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const hashOf=(salt,i,v)=>sha(salt+':'+i+':'+norm(v));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const h=(html)=>{const d=document.createElement('div');d.innerHTML=html;return d.firstElementChild};

function render(){
  app.innerHTML='';
  const head=h(`<header class="top"><div><h1>다시보기 <em>채점실</em></h1><p class="sub">${view.mode==='teacher'?'시험을 올리면 학생들이 이 링크에서 직접 채점해요.':'다 맞았는지만 알려줘요. 틀린 곳은 처음부터 다시 보면서 스스로 찾아요.'}</p></div></header>`);
  if(canTeach){const tb=h(`<div class="tabs" role="group"><button data-m="student" aria-pressed="${view.mode==='student'}">학생 화면</button><button data-m="teacher" aria-pressed="${view.mode==='teacher'}">선생님</button></div>`);
    tb.onclick=e=>{const m=e.target.dataset.m;if(m){view={mode:m,exam:null};render()}};head.appendChild(tb)}
  app.appendChild(head);
  if(view.mode==='teacher') return renderTeacher();
  if(view.exam) return renderExam(STATE.exams.find(x=>x.id===view.exam));
  renderHome();
}

function renderHome(){
  const p=h(`<section class="panel"><div class="field"><label class="label" for="sname">내 이름</label><input type="text" id="sname" placeholder="예: 김민준" value="${esc(prog._name||'')}"></div></section>`);
  p.querySelector('#sname').oninput=e=>{prog._name=e.target.value;saveProg()};
  app.appendChild(p);
  if(!STATE.exams.length){app.appendChild(h(`<div class="panel"><p class="hint">아직 올라온 시험이 없어요. 선생님이 시험을 올리면 여기에 나타나요.</p></div>`));return}
  const list=h(`<div class="exam-list"></div>`);
  STATE.exams.forEach(ex=>{const pr=prog[ex.id];const done=pr&&pr.done;
    const c=h(`<button class="exam-card"><div class="row">${ex.sample?'<span class="chip ex">예시</span>':''}${done?'<span class="chip done">완료</span>':pr&&pr.attempts.length?`<span class="chip">${pr.attempts.length}회 채점함</span>`:''}</div><h3>${esc(ex.title)}</h3><div class="meta">${ex.hashes.length}문항 · 시험지 ${ex.images.length}장</div></button>`);
    c.onclick=()=>{if(!norm(prog._name)){toast('이름을 먼저 적어 주세요');document.getElementById('sname').focus();return}view.exam=ex.id;render();scrollTo(0,0)};list.appendChild(c)});
  app.appendChild(list);
}

const qn=(ex,i)=>(ex.start||1)+i;
function renderExam(ex){
  if(!ex){view.exam=null;return render()}
  const pr=prog[ex.id]||(prog[ex.id]={answers:Array(ex.hashes.length).fill(''),attempts:[],start:Date.now(),done:null});
  const back=h(`<button class="btn ghost small back">← 시험 목록</button>`);back.onclick=()=>{view.exam=null;render()};app.appendChild(back);
  if(pr.done) return renderCert(ex,pr);
  const lay=h(`<div class="exam-layout"><section class="panel"><h2>${esc(ex.title)}</h2><div class="sheet-imgs"></div></section><aside class="panel answers"><div class="row" style="justify-content:space-between"><span class="label">답안지</span><span class="hint">${esc(prog._name)}</span></div><div class="ans-grid"></div><div id="vbox"></div><button class="btn" id="grade">채점하기</button><p class="hint" style="margin:0">분수는 1/2, 객관식은 번호(③ 또는 3)로 적어요.</p></aside></div>`);
  const imgs=lay.querySelector('.sheet-imgs');
  if(ex.images.length) ex.images.forEach((src,i)=>{const im=document.createElement('img');im.src=src;im.alt=`시험지 ${i+1}쪽`;imgs.appendChild(im)});
  else imgs.appendChild(h(`<div class="noimg">시험지는 종이로 받았어요. 종이 시험지를 보고 오른쪽에 답을 적으세요.</div>`));
  const grid=lay.querySelector('.ans-grid');
  pr.answers.forEach((v,i)=>{const a=h(`<label class="ans"><span>${qn(ex,i)}</span><input type="text" id="a${i}" autocomplete="off" value="${esc(v)}"></label>`);
    a.querySelector('input').oninput=e=>{pr.answers[i]=e.target.value;saveProg()};grid.appendChild(a)});
  app.appendChild(lay);
  const gbtn=lay.querySelector('#grade'), vbox=lay.querySelector('#vbox');
  const last=pr.attempts[pr.attempts.length-1];
  if(last) showVerdict(ex,pr,vbox,gbtn,grid,last);
  gbtn.onclick=async()=>{
    const blank=pr.answers.findIndex(a=>!norm(a));
    if(blank>=0){toast(`${qn(ex,blank)}번 답이 비어 있어요`);grid.querySelectorAll('input')[blank].focus();return}
    gbtn.disabled=true;
    const wrong=[];for(let i=0;i<ex.hashes.length;i++){const hv=await hashOf(ex.salt,i,pr.answers[i]);if(!ex.hashes[i].includes(hv))wrong.push(i)}
    const at={w:wrong,a:Object.fromEntries(wrong.map(i=>[i,pr.answers[i]])),t:Date.now()};pr.attempts.push(at);
    if(!wrong.length){pr.done=Date.now();saveProg();render();scrollTo(0,0);return}
    pr.checked=[];saveProg();showVerdict(ex,pr,vbox,gbtn,grid,at);
  };
}

function showVerdict(ex,pr,vbox,gbtn,grid,at){
  pr.checked=pr.checked||[];
  const v=h(`<div class="verdict bad"><div class="big">아직 다 맞지 않았어요</div><p style="margin:0">몇 번이 틀렸는지, 몇 개가 틀렸는지는 알려주지 않아요. 1번부터 끝까지 다시 확인하고 다시 채점하세요.</p><div class="checks"></div><div class="log"></div></div>`);
  const cw=v.querySelector('.checks');
  CHECKS.forEach((c,i)=>{const l=h(`<label class="check"><input type="checkbox" id="c${i}" ${pr.checked.includes(i)?'checked':''}><span>${c}</span></label>`);
    l.querySelector('input').onchange=e=>{pr.checked=pr.checked.filter(x=>x!==i);if(e.target.checked)pr.checked.push(i);saveProg();upd()};cw.appendChild(l)});
  v.querySelector('.log').innerHTML=pr.attempts.map((a,i)=>`<b>${i+1}차 다시 확인</b>`).join('');
  vbox.innerHTML='';vbox.appendChild(v);
  const upd=()=>{const ok=pr.checked.length===CHECKS.length;gbtn.disabled=!ok;gbtn.textContent=ok?`${pr.attempts.length+1}차 채점하기`:'검토를 모두 체크해야 다시 채점할 수 있어요'};upd();
}

/* ---------- crypto for the locked AI analysis ---------- */
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=s=>new Uint8Array(s.match(/../g).map(x=>parseInt(x,16)));
const b64=b=>{let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const xor=(a,b)=>a.map((x,i)=>x^b[i]);
async function kdf(salt,i,v){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('k|'+salt+'|'+i+'|'+norm(v))))}
async function lockAnalysis(salt,alts,obj){
  const master=crypto.getRandomValues(new Uint8Array(32));
  const shares=alts.map(()=>crypto.getRandomValues(new Uint8Array(32)));
  shares[shares.length-1]=shares.slice(0,-1).reduce((acc,s)=>xor(acc,s),master);
  const wraps=[];for(let i=0;i<alts.length;i++){const w=[];for(const a of alts[i])w.push(hex(xor(shares[i],await kdf(salt,i,a))));wraps.push(w)}
  const key=await crypto.subtle.importKey('raw',master,'AES-GCM',false,['encrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  return {wraps,iv:b64(iv),ct:b64(ct)};
}
async function unlockAnalysis(ex,answers){
  if(!ex.lock)return null;
  try{let master=new Uint8Array(32);
    for(let i=0;i<ex.hashes.length;i++){const hv=await hashOf(ex.salt,i,answers[i]);const j=ex.hashes[i].indexOf(hv);if(j<0)return null;
      master=xor(master,xor(unhex(ex.lock.wraps[i][j]),await kdf(ex.salt,i,answers[i])))}
    const key=await crypto.subtle.importKey('raw',master,'AES-GCM',false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(ex.lock.iv)},key,unb64(ex.lock.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){return null}
}
const TYPES=['문제를 잘못 읽음','조건을 놓침','계산 실수','부호 실수','옮겨 적기 실수','개념 부족'];

function renderCert(ex,pr){
  const mins=Math.max(1,Math.round((pr.done-pr.start)/60000));
  const everWrong=[...new Set(pr.attempts.flatMap(a=>a.w))].sort((a,b)=>a-b);
  const fmt=t=>new Date(t).toLocaleString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const c=h(`<section class="cert"><div class="big" style="color:var(--green);font-family:var(--f-display)">다 맞았어요!</div>
  <p style="margin:0">${everWrong.length?'틀렸던 문제를 AI가 분석했어요. 읽어 보고 이 보고서를 선생님께 보여주세요.':'한 번에 다 맞았어요. 이 화면을 선생님께 보여주세요.'}</p>
  <dl><dt>이름</dt><dd>${esc(prog._name)}</dd><dt>시험</dt><dd>${esc(ex.title)}</dd><dt>채점 횟수</dt><dd>${pr.attempts.length}회</dd><dt>한 번이라도 틀린 문제</dt><dd>${everWrong.length}문항 / ${ex.hashes.length}문항</dd><dt>걸린 시간</dt><dd>약 ${mins}분</dd><dt>완료</dt><dd>${fmt(pr.done)}</dd></dl>
  <div><div class="label" style="margin-bottom:6px">회차별 틀린 문제</div><div class="rtable">${pr.attempts.map((a,i)=>`<div class="rrow"><span class="rno">${i+1}차</span><span class="rq">${a.w.length?a.w.map(q=>`<b class="qb">${qn(ex,q)}번</b>`).join(''):'<b class="qb ok">모두 정답</b>'}</span></div>`).join('')}</div></div>
  <div class="summary" hidden></div><div class="why"></div>
  <div class="row"><button class="btn ghost small" id="retry">처음부터 다시 풀기</button></div></section>`);
  let armed=false;const rb=c.querySelector('#retry');
  rb.onclick=()=>{if(!armed){armed=true;rb.textContent='한 번 더 누르면 기록이 지워져요';setTimeout(()=>{armed=false;rb.textContent='처음부터 다시 풀기'},3000);return}delete prog[ex.id];saveProg();render()};
  app.appendChild(c);
  if(!everWrong.length)return;
  const why=c.querySelector('.why');
  why.innerHTML='<p class="hint">분석을 여는 중…</p>';
  unlockAnalysis(ex,pr.answers).then(an=>{
    why.innerHTML='';
    const qmap={};(an&&an.questions||[]).forEach(q=>qmap[(q.no|0)-(ex.start||1)]=q);
    const tally={};
    everWrong.forEach(q=>{
      const mine=pr.attempts.map((a,i)=>a.w.includes(q)?{r:i+1,v:(a.a&&a.a[q])||''}:null).filter(Boolean);
      const A=qmap[q];
      const rows=mine.map(m=>{const hit=A&&(A.mistakes||[]).find(x=>String(x.answer).split('|').some(v=>norm(v)===norm(m.v)));
        if(hit&&hit.type)tally[hit.type]=(tally[hit.type]||0)+1;
        return `<div class="arow"><span class="rno">${m.r}차</span><div style="min-width:0"><div><b class="ans-w">${esc(m.v)}</b>${hit&&hit.type?` <span class="chip warn">${esc(hit.type)}</span>`:''}</div><div class="areason">${hit?esc(hit.reason):A?'예상한 실수 목록에 없는 답이에요. 아래 풀이와 내 풀이를 한 줄씩 비교해 보세요.':''}</div></div></div>`}).join('');
      const card=h(`<div class="wcard"><div class="row" style="justify-content:space-between"><strong>${qn(ex,q)}번${A&&A.concept?` · ${esc(A.concept)}`:''}</strong><span class="hint">고친 답 ${esc(pr.answers[q])}</span></div>
        ${rows}
        ${A?`${A.solution?`<div class="ablock"><span class="label">바른 풀이</span><div>${esc(A.solution)}</div></div>`:''}${A.tip?`<div class="ablock"><span class="label">다음에 검토할 때</span><div>${esc(A.tip)}</div></div>`:''}`:'<p class="hint" style="margin:0">이 시험에는 AI 분석이 없어요. 선생님과 함께 왜 틀렸는지 확인해 보세요.</p>'}</div>`);
      why.appendChild(card)});
    const ks=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
    if(ks.length){const s=c.querySelector('.summary');s.hidden=false;
      s.innerHTML=`<div class="label" style="margin-bottom:6px">나의 실수 유형</div><div class="tally">${ks.map(([k,n])=>`<div class="trow"><span>${esc(k)}</span><span class="tbar"><i style="width:${Math.round(n/ks[0][1]*100)}%"></i></span><b>${n}번</b></div>`).join('')}</div><p class="hint" style="margin:6px 0 0">가장 많은 실수는 <strong>${esc(ks[0][0])}</strong>예요. 다음 시험에서는 이 부분부터 검토하세요.</p>`}
  });
}

let draft={title:'',key:'',images:[],analysis:null};
function keyStart(t){const m=String(t||'').trim().match(/^(\d+)\s*[.):\]]/);return m?+m[1]:1}
function parseKey(t){return t.split('\n').map(l=>l.replace(/^\s*\d+\s*[.):\]]\s*/,'').trim()).filter(Boolean)}
function dataUrlToBlob(u){const [m,d]=u.split(',');const type=m.match(/data:([^;]+)/)[1];return new Blob([unb64(d)],{type})}
function analysisPrompt(key,st){st=st||1;
  return `당신은 한국 중학교 수학 교사입니다. 첨부한 이미지는 시험지이고, 아래는 각 문항의 정답입니다(| 는 같은 정답의 다른 표기).
${key.map((k,i)=>`${st+i}번: ${k}`).join('\n')}

각 문항마다 중학생이 실제로 자주 적는 오답을 3~5개 예상하고, 그 오답이 왜 나오는지 분석하세요. 오답은 학생이 답안지에 적을 그대로의 형태로 쓰세요(예: -3, 1/2, ②). 같은 오답의 다른 표기는 | 로 이으세요.
type은 반드시 다음 중 하나: ${TYPES.join(', ')}
reason은 학생에게 직접 말하듯 1~2문장, 풀이의 어느 단계에서 무엇을 잘못했는지 구체적으로.
solution은 핵심 풀이 1~3줄. tip은 이 문제를 검토할 때 확인할 것 한 문장.
이미지에서 문항을 읽을 수 없으면 concept를 "확인 필요"로 쓰고 정답만 보고 추정하세요.

JSON만 출력하세요:
{"questions":[{"no":${st},"concept":"단원/개념 짧게","solution":"...","tip":"...","mistakes":[{"answer":"...","type":"...","reason":"..."}]}]}`;
}

    sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';res(window.pdfjsLib)};sc.onerror=()=>{pdfLib=null;rej(new Error('pdfjs'))};document.head.appendChild(sc)});
  return pdfLib}
async function openPdf(file){const lib=await loadPdfJs();return lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise}
async function pdfToImages(file,onp){const doc=await openPdf(file);const out=[];
  for(let i=1;i<=doc.numPages;i++){onp&&onp(i,doc.numPages);const pg=await doc.getPage(i);const v1=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(2.5,1400/v1.width)});
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:x,viewport:vp}).promise;out.push(c.toDataURL('image/jpeg',.72))}
  return out}
/* ---------- answer-key reading (빠른답지) ---------- */
let keySrc=null; // {pages:[{img, text}]} hi-res pages kept in memory only
async function loadKeyFiles(files,onp){const pages=[];
  for(const f of files){
    if(isPdf(f)){const doc=await openPdf(f);
      for(let i=1;i<=doc.numPages;i++){onp&&onp(`${f.name} ${i}/${doc.numPages}쪽 준비 중…`);const pg=await doc.getPage(i);
        const v1=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(4,2600/v1.width)});
        const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
        await pg.render({canvasContext:x,viewport:vp}).promise;
        let text='';try{text=layoutText(await pg.getTextContent(),v1)}catch(e){}
        pages.push({canvas:c,text})}}
    else{const c=await fileToCanvas(f,2600);pages.push({canvas:c,text:''})}}
  return {pages}}
function fileToCanvas(file,maxW){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(2,maxW/im.width);const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);res(c)};im.onerror=rej;im.src=r.result};r.readAsDataURL(file)})}
/* Rebuild the page's text in reading rows, keeping big horizontal gaps as column breaks */
function layoutText(tc,vp){const items=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({s:it.str.trim(),x:it.transform[4],y:vp.height-it.transform[5],w:it.width||0}));
  items.sort((a,b)=>a.y-b.y||a.x-b.x);const rows=[];
  for(const it of items){const r=rows.find(r=>Math.abs(r.y-it.y)<4);if(r)r.items.push(it);else rows.push({y:it.y,items:[it]})}
  return rows.sort((a,b)=>a.y-b.y).map(r=>{r.items.sort((a,b)=>a.x-b.x);let line='',end=null;
    for(const it of r.items){if(end!==null)line+=(it.x-end>18?'   ‖   ':' ');line+=it.s;end=it.x+it.w}return line}).join('\n')}
/* Whole page + 2x2 overlapping zoomed tiles, so small print survives downsizing */
function pageImages(c,maxCount){const out=[c];if(maxCount>=5){const W=c.width,H=c.height,ov=0.08;
  for(const [cx,cy] of [[0,0],[1,0],[0,1],[1,1]]){const x0=Math.max(0,Math.round(W*(cx*0.5-ov))),y0=Math.max(0,Math.round(H*(cy*0.5-ov)));
    const w=Math.min(W-x0,Math.round(W*(0.5+ov))),h=Math.min(H-y0,Math.round(H*(0.5+ov)));
    const t=document.createElement('canvas');t.width=w;t.height=h;t.getContext('2d').drawImage(c,x0,y0,w,h,0,0,w,h);out.push(t)}}
  return out}
const canvasBlob=c=>new Promise(r=>c.toBlob(b=>r(b),'image/png'));
function parseRange(s){const m=String(s||'').replace(/\s/g,'').match(/^(\d+)(?:[-~](\d+))?$/);if(!m)return null;const a=+m[1],b=m[2]?+m[2]:a;return a<=b?[a,b]:[b,a]}
function keyPrompt2(pageNo,text,range,unit,tiles){return `첨부한 이미지는 한국 중학교 수학 문제집·시험지의 "빠른 정답"(빠른답지) ${pageNo}쪽입니다.${tiles?` 첫 번째 이미지는 쪽 전체이고, 나머지 4장은 같은 쪽을 왼쪽 위·오른쪽 위·왼쪽 아래·오른쪽 아래로 확대한 조각입니다(조각끼리 조금 겹칩니다). 작은 글씨는 확대 조각에서 읽고, 위치와 단 순서는 전체 이미지로 확인하세요.`:''}

빠른답지는 보통 여러 단으로 "번호 답" 칸이 빽빽하게 이어집니다. 번호와 답을 헷갈리지 않게 칸 하나씩 읽으세요.
${unit?`이 쪽에 여러 단원이 있으면 "${unit}" 부분만 읽으세요.\n`:''}${range?`문항 번호 ${range[0]}번부터 ${range[1]}번까지만 필요합니다. 이 범위 밖은 출력하지 마세요.\n`:''}
규칙:
- 최종 답만 씁니다. 풀이는 빼요.
- 객관식 동그라미 숫자는 숫자와 함께: ③|3. 답이 두 개인 객관식은 "②,④" 그대로.
- 분수 a/b, 음수 -3, 거듭제곱 x^2, 루트 √2 처럼 씁니다. 같은 답의 다른 표기는 | 로 잇습니다 (1/2|0.5, x=6|6).
- 글씨가 흐리거나 확실하지 않으면 sure를 false로.
- 답이 문장·그림·서술형이라 한 줄로 정해지지 않으면 answer를 "서술형", sure를 false로.
${text.trim()?`\n이 쪽의 PDF 글자입니다(글자 자체는 정확함, ‖ 는 단·칸 경계). 이미지와 맞춰 보며 우선 활용하세요:\n${text.slice(0,12000)}\n`:''}
JSON만 출력: {"answers":[{"no":1,"answer":"③|3","sure":true}]}`}

async function readKeyWithAI(opts,onp){
  const sample=await window.claude?.use?.('sample');const lim=sample&&await sample.limits().catch(()=>null);
  if(!lim||!lim.images)throw {code:'no_ai'};
  const got={};const pagesIdx=opts.pages;
  for(let k=0;k<pagesIdx.length;k++){const p=keySrc.pages[pagesIdx[k]];onp(`AI가 ${pagesIdx[k]+1}쪽을 읽는 중… (${k+1}/${pagesIdx.length})`);
    const imgs=pageImages(p.canvas,lim.images.maxCount);const blobs=await Promise.all(imgs.map(canvasBlob));
    const res=await sample.json(keyPrompt2(pagesIdx[k]+1,p.text,opts.range,opts.unit,imgs.length>1),{images:blobs,modelTier:'complex'});
    for(const a of (res&&res.answers)||[]){const n=parseInt(a.no,10);if(!n)continue;if(opts.range&&(n<opts.range[0]||n>opts.range[1]))continue;
      const v=String(a.answer||'').trim();if(!v)continue;if(!got[n]||(!got[n].sure&&a.sure!==false))got[n]={v,sure:a.sure!==false&&v!=='서술형'}}}
  const nums=Object.keys(got).map(Number);if(!nums.length)throw {code:'empty'};
  const [a,b]=opts.range||[Math.min(...nums),Math.max(...nums)];
  const lines=[];let unsure=0,missing=0;
  for(let n=a;n<=b;n++){const g=got[n];if(!g){lines.push('확인 필요 (못 읽음)');missing++}else if(!g.sure){lines.push('확인 필요 '+g.v);unsure++}else lines.push(g.v)}
  return {start:a,lines,unsure,missing}}

function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1400/im.width);const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(file)})}
