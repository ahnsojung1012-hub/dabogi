<style>
/* Layout: navy masthead, then roster rail on the left and one student's study record on the right; stacks on phones. */
:root{
  --paper:#f3f5f7; --sheet:#ffffff; --grid:#e4e9ee; --ink:#14202e; --muted:#566373;
  --line:#d3dbe4; --blue:#1d5b78; --blue-soft:#e2eef3; --red:#c23b2c; --red-soft:#fbe9e6;
  --green:#257a4c; --green-soft:#e2f2e8; --hi:#f4c84a; --band:#13283b; --band-ink:#f3f5f7; --dot:#c9d2dc;
  --f-display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0e161f; --sheet:#15202b; --grid:#18242f; --ink:#e5ecf2; --muted:#93a2b2;
  --line:#283746; --blue:#72b4d3; --blue-soft:#163040; --red:#ff8a78; --red-soft:#3a201c;
  --green:#64d29b; --green-soft:#15302a; --hi:#e8bd45; --band:#1c3850; --band-ink:#eef2f6; --dot:#253443; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;min-height:100%;
  background-color:var(--paper);
  background-image:radial-gradient(ellipse 120% 420px at 50% -60px,color-mix(in srgb,var(--band) 16%,transparent),transparent 70%),radial-gradient(circle,var(--dot) 1.2px,transparent 1.4px);
  background-size:100% 100%,22px 22px;background-attachment:scroll,scroll;background-repeat:no-repeat,repeat}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header.top{position:relative;overflow:hidden;background:var(--band);color:var(--band-ink);border-radius:16px;padding:22px}
header.top>*{position:relative}
header.top .note{position:absolute;right:14px;top:-6px;font-family:var(--f-display);font-size:52px;line-height:1;white-space:nowrap;opacity:.08;pointer-events:none}
header.top .note sup{font-size:.55em}
.acad{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--hi)}
.acad::before{content:"";width:18px;height:2px;background:var(--hi)}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.15;margin:6px 0 0}
h1 em{font-style:normal;position:relative;z-index:0;white-space:nowrap}
h1 em::after{content:"";position:absolute;left:-3px;right:-3px;bottom:.02em;height:.3em;background:var(--hi);opacity:.85;z-index:-1;border-radius:2px}
header.top .sub{color:var(--band-ink);opacity:.78}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0}
h3{font-size:15px;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.hint{font-size:13px;color:var(--muted)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:260px;resize:vertical;line-height:1.7}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;border-radius:9px;padding:9px 16px;border:1px solid var(--band);background:var(--band);color:var(--band-ink);cursor:pointer}
#copy,#go{background:var(--hi);border-color:var(--hi);color:#13283b}
.btn.ghost{background:none;color:var(--blue)}.btn:disabled{opacity:.4}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
.roster{display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow-y:auto}
.cls{font-size:12px;font-weight:700;color:var(--muted);padding:10px 8px 4px;letter-spacing:.04em}
.st{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:8px;padding:7px 9px;cursor:pointer}
.st:hover{background:var(--paper)}.st[aria-current="true"]{background:var(--blue-soft);border-color:var(--blue)}
.st b{font-weight:700}.st .m{grid-column:1/-1;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.st.none .t{color:var(--muted)}
.classbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.cb{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:170px;text-align:left;font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}

.st.all b{color:var(--blue)}
.ctable tbody tr{cursor:pointer}.ctable tbody tr:hover,.ctable tbody tr:focus-visible{background:var(--blue-soft)}
.live{gap:6px;border-color:var(--hi);background:var(--sheet)}
.dot-live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot-live{animation:none}}
.btn.small{padding:5px 10px;font-size:13px}
.passlist{display:flex;flex-wrap:wrap;gap:6px}
.pchip{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--green-soft);color:var(--green);font-variant-numeric:tabular-nums}.pchip b{color:var(--ink)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.days{display:flex;gap:3px;flex-wrap:wrap}
.day{width:22px;height:22px;border-radius:5px;background:var(--grid);font-size:10px;display:grid;place-items:center;color:var(--muted);font-variant-numeric:tabular-nums}
.day.l1{background:color-mix(in srgb,var(--blue) 30%,var(--grid));color:var(--ink)}.day.l2{background:color-mix(in srgb,var(--blue) 60%,var(--grid));color:var(--sheet)}.day.l3{background:var(--blue);color:var(--sheet)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:700;border-top:0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--blue-soft);color:var(--blue)}
.chip.ok{background:var(--green-soft);color:var(--green)}.chip.warn{background:var(--red-soft);color:var(--red)}
.timeline{display:flex;flex-direction:column;gap:12px}
.dgroup{display:flex;flex-direction:column;gap:6px}
.dhead{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.sess{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;font-size:14px;padding:4px 0}
.sess .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.ev{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.ev span{font-size:12px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.ev span.done{border-color:var(--green);color:var(--green)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:9px;font-weight:500;z-index:20}
.tally{display:flex;flex-direction:column;gap:5px}
.trow{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.tbar{height:9px;background:var(--grid);border-radius:99px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--red)}
.trow b{text-align:right}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opts .lbl{width:100%;font-size:12px;color:var(--muted)}
.opt{cursor:pointer}.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-block;padding:5px 11px;border-radius:99px;border:1px solid var(--line);font-size:13px;background:var(--sheet);color:var(--muted)}
.opt input:checked+span{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:700}
.opt input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.rbtns{display:flex;gap:4px;flex-wrap:nowrap}.kbtn{background:#fee500!important;color:#191600!important;border-color:#fee500!important}
.wtabs{display:flex;gap:4px;border-bottom:2px solid var(--line,#e3e8ee);margin:2px 0 4px}.wtabs button{font:inherit;font-weight:700;background:none;border:0;padding:9px 14px;color:#6b7785;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}.wtabs button[aria-selected="true"]{color:#13283b;border-bottom-color:#00abff}
.wpanel{display:flex;flex-direction:column;gap:18px}.wsec h3{margin:0;font-size:16px}
.wqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:10px}
.wq{background:#fff;border:1px solid #e3e8ee;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;color:#1b1b1b}.wq img{width:100%;height:auto;border-top:1px solid #f0f0f0;padding-top:6px}
.wq-h{display:flex;gap:8px;align-items:center}.wq-n{flex:none;background:#ff8a00;color:#fff;font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}.wq-h b{font-size:14px}
.wq-s{font-size:13px;color:#555}.wq-c{color:#e57a00;font-size:16px}.wq-who{display:flex;flex-wrap:wrap;gap:4px}.wq-who span{background:#fff3e6;color:#9a4f00;border-radius:999px;padding:2px 8px;font-size:12px}.wq-who small{opacity:.75}
.wq-r{font-size:13px;border-top:1px dashed #eee;padding-top:5px}.wq-r s{color:#c0392b;font-weight:700}.wq-r em{font-style:normal;font-size:11px;font-weight:700;color:#c0392b;background:#fdecea;border-radius:999px;padding:1px 7px;margin-left:6px}.wq-r p{margin:2px 0 0;color:#444}

<body>
<main class="wrap" id="app"></main>
<script>
(function(){
const EP='https://script.google.com/macros/s/AKfycbyzt_AuvfzMXuLG0IzsM_GzG-Kx7oqzvLBCkQ7eWxhmu_kDD6ETHH4fs39pB_b2kc_5PQ/exec';
const app=document.getElementById('app');
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const h=html=>{const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const pad=n=>String(n).padStart(2,'0');
const ymd=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const WD='일월화수목금토';
const md=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const hm=t=>{const d=new Date(t);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dur=sec=>{sec=Math.max(0,Math.round(sec||0));const m=Math.floor(sec/60),hh=Math.floor(m/60);return hh?`${hh}시간 ${m%60}분`:m?`${m}분`:sec?`${sec}초`:'0분'};
const key=(c,n)=>c+'|'+n;
const J=s=>{try{return JSON.parse(s)}catch(e){return null}};

let DATA=null, sel=null;
const OPTS=[['days','공부한 날 수'],['dates','공부한 날짜'],['time','총 푼 시간'],['count','완료한 시험 수'],['exams','시험별 기록'],['examDate','└ 완료한 날짜'],['attempts','└ 채점 횟수'],['first','└ 처음 틀린 문항 수'],['examTime','└ 시험별 푼 시간'],['tally','자주 한 실수'],['method','공부 방식 설명']];
const popt=Object.assign({days:true,dates:true,time:true,count:true,exams:true,examDate:true,attempts:true,first:true,examTime:true,tally:true,method:true},J(ls.get('dabogi.t.opts','{}'))||{});
let from=ls.get('dabogi.t.from',ymd(Date.now()-27*864e5)), to=ls.get('dabogi.t.to',ymd(Date.now())), clsF=ls.get('dabogi.t.cls','');

function header(){return `<header class="top"><div class="note" aria-hidden="true">x<sup>n</sup>+y<sup>n</sup>=z<sup>n</sup></div><span class="acad">페르마 수학학원</span><h1>블라인드 테스트 <em>학습 기록</em></h1><p class="sub">학생별로 언제, 얼마나, 몇 번 만에 풀었는지 봐요. 학부모님께 보낼 요약문도 만들 수 있어요.</p></header>`}

function renderLogin(msg){
  app.innerHTML=header();
  if(!EP||EP.indexOf('__')===0){app.appendChild(h(`<section class="panel"><p>아직 기록 저장 주소가 연결되지 않았어요. Claude에게 스프레드시트 연결을 마무리해 달라고 해 주세요.</p></section>`));return}
  const p=h(`<section class="panel" style="max-width:420px"><div class="field"><label class="label" for="pw">선생님 비밀번호</label><input type="password" id="pw" autocomplete="current-password"></div>
    <label class="row hint" style="gap:6px"><input type="checkbox" id="rem" style="width:auto" checked> 이 기기에서 기억하기</label>
    <div class="row"><button class="btn" id="go">기록 보기</button><span class="hint" id="msg">${esc(msg||'스프레드시트 "설정" 시트 B1 칸에 적은 비밀번호예요.')}</span></div></section>`);
  const go=()=>load(p.querySelector('#pw').value,p.querySelector('#rem').checked);
  p.querySelector('#go').onclick=go;p.querySelector('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
  app.appendChild(p);p.querySelector('#pw').focus();
}

async function load(pw,remember){
  app.querySelectorAll('#msg').forEach(m=>m.textContent='불러오는 중…');
  try{const r=await(await fetch(EP+'?action=data&key='+encodeURIComponent(pw))).json();
    if(!r.ok){ls.del('dabogi.t.pw');return renderLogin(r.error==='bad_key'?'비밀번호가 맞지 않아요. 설정 시트 B1 칸을 확인해 주세요.':'불러오지 못했어요: '+r.error)}
    if(remember)ls.set('dabogi.t.pw',pw);
    DATA=r;DATA.pw=pw;initLive();renderMain()}
  catch(e){renderLogin('인터넷 연결을 확인하고 다시 눌러 주세요.')}
}

function inRange(t){const d=ymd(t);return d>=from&&d<=to}

/* Turn raw rows into per-student study records */
/* ---------- 오답노트 PDF ---------- */
let BOOKS=null;
async function getBooks(){if(BOOKS)return BOOKS;BOOKS=(await(await fetch('notes/books.json?v='+Date.now())).json()).books;return BOOKS}
/* JPEG 페이지들을 그대로 담는 작은 PDF 작성기 (외부 도구 없이) */
function jpegPdf(pages){const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(n,body)=>{offs[n]=len;push(`${n} 0 obj\n`);body();push('\nendobj\n')};
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const N=pages.length,W=595.28,H=841.89;
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Count ${N} /Kids [${pages.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] >>`));
  pages.forEach((pg,i)=>{const pn=3+i*3,cn=pn+1,im=pn+2;
    obj(pn,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${im} 0 R >> >> /Contents ${cn} 0 R >>`));
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    obj(cn,()=>{push(`<< /Length ${cs.length} >>\nstream\n`);push(cs);push('\nendstream')});
    obj(im,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.data.length} >>\nstream\n`);push(pg.data);push('\nendstream')})});
  const xref=len,n=3+N*3;
  push(`xref\n0 ${n}\n0000000000 65535 f \n`+offs.slice(1,n).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join(''));
  push(`trailer\n<< /Size ${n} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'})}
const canvasJpeg=cv=>{const d=atob(cv.toDataURL('image/jpeg',.88).split(',')[1]);const u=new Uint8Array(d.length);for(let i=0;i<d.length;i++)u[i]=d.charCodeAt(i);return {w:cv.width,h:cv.height,data:u}};
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
const loadImg=src=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src});
function decSel(s){const out=[];String(s||'').split('|').forEach(g=>{const[k,ns]=g.split(':');if(k&&ns)ns.split('.').forEach(n=>out.push(k+':'+n))});return out}

const b64u=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};

function wrongCard(id,q,CC,body){const cc=CC[id]||{},st=cc.start||1;

function buildStudentWrong(panel,rec,CC){

    sec.querySelector('.wqgrid').innerHTML=qs.map(q=>{const rs=e.wq[q].sort((a,b)=>a-b),W=(e.why||{})[q];

function buildClassWrong(panel,mem,recs,CC){
  const agg={};

    Object.entries(e.wq).forEach(([q,rs])=>{(A.q[q]=A.q[q]||[]).push({name:r.name,rs,fixed:!!e.done})})})});
  mem.forEach(r=>{const rec=recs[key(r.cls,r.name)];if(rec)rec.exams.forEach(e=>{if(agg[e.id])agg[e.id].people.add(r.name)})});

    panel.appendChild(sec)})}
function studentRecord(c,n){
  const rows=DATA.rows.filter(r=>r.ev!=='note'&&String(r.cls)===String(c)&&String(r.name)===String(n)&&inRange(r.at)).sort((a,b)=>a.at-b.at);
  const sess={};
  rows.forEach(r=>{const k=r.session||('x'+r.at);const s=sess[k]||(sess[k]={id:k,start:r.at,end:r.at,active:0,exam:r.examTitle,examId:r.examId,events:[]});
    s.start=Math.min(s.start,r.at);s.end=Math.max(s.end,r.at);s.active=Math.max(s.active,Number(r.activeSec)||0);s.events.push(r)});
  const sessions=Object.values(sess).sort((a,b)=>a.start-b.start);
  const exams={};
  rows.forEach(r=>{const e=exams[r.examId]||(exams[r.examId]={id:r.examId,title:r.examTitle,total:r.total,first:r.at,last:r.at,attempts:0,done:null,firstWrong:null,time:0,tally:null,everWrong:''});
    e.first=Math.min(e.first,r.at);e.last=Math.max(e.last,r.at);
    if(r.ev==='attempt'||r.ev==='done'){e.attempts=Math.max(e.attempts,Number(r.attempt)||0);if(Number(r.attempt)===1)e.firstWrong=Number(r.wrongCount)||0}
    if(r.ev==='done'){e.done=r.at;const x=J(r.extra);if(x&&x.runSec)e.runSec=x.runSec;if(x)e.dx=x}
    if(r.ev==='attempt'&&r.wrong){String(r.wrong).split(',').map(x=>parseInt(x,10)).filter(Boolean).forEach(q=>{const a=(e.wq=e.wq||{})[q]=(e.wq[q]||[]);if(!a.includes(+r.attempt))a.push(+r.attempt)})}
    if(r.ev==='why'){const x=J(r.extra);if(x&&x.q){(e.why=e.why||{})[x.q]=x}}
    if(r.ev==='report'){const x=J(r.extra);if(x&&x.tally)e.tally=x.tally;e.everWrong=r.wrong}});
  sessions.forEach(s=>{if(exams[s.examId])exams[s.examId].time+=s.active});
  const tally={};Object.values(exams).forEach(e=>e.tally&&Object.entries(e.tally).forEach(([k,v])=>tally[k]=(tally[k]||0)+v));
  const days={};sessions.forEach(s=>{const d=ymd(s.start);days[d]=(days[d]||0)+s.active});
  const total=sessions.reduce((a,s)=>a+s.active,0);
  return {rows,sessions,exams:Object.values(exams).sort((a,b)=>a.first-b.first),tally,days,total,last:rows.length?rows[rows.length-1].at:null};
}

  ov.onclick=()=>{sel=null;renderMain()};ro.appendChild(ov);
  mem.forEach(r=>{const rec=recs[key(r.cls,r.name)];const done=rec.exams.filter(e=>e.done).length;
    const b=h(`<button class="st ${rec.rows.length?'':'none'}" aria-current="${sel===key(r.cls,r.name)}"><b>${esc(r.name)}</b><span class="t">${rec.rows.length?dur(rec.total):'기록 없음'}</span><span class="m">${rec.rows.length?`${Object.keys(rec.days).length}일 · 완료 ${done}개 · 마지막 ${md(rec.last)}`:'이 기간에 푼 시험이 없어요'}</span></button>`);
    b.onclick=()=>{sel=key(r.cls,r.name);renderMain();if(window.innerWidth<820)document.getElementById('detail').scrollIntoView({behavior:'smooth'})};ro.appendChild(b)});
  app.appendChild(lay);
  const det=lay.querySelector('#detail');
  if(!sel||!recs[sel]){renderClass(det,clsF,mem,recs);return}
  const [c,n]=sel.split('|');renderDetail(det,c,n,recs[sel]);
  const back=h(`<button class="btn ghost" style="align-self:flex-start">← ${esc(c)} 전체 보기</button>`);back.onclick=()=>{sel=null;renderMain()};det.prepend(back);
}

function renderClass(det,c,mem,recs){
  const rows=mem.map(r=>({r,rec:recs[key(r.cls,r.name)]}));
  const act=rows.filter(x=>x.rec.rows.length);
  const tot=act.reduce((a,x)=>a+x.rec.total,0);
  det.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${esc(c)}</h2><span class="hint">${md(from)} ~ ${md(to)}</span></div>
  <div class="tiles"><div class="tile"><div class="label">학생</div><div class="v">${mem.length}명</div></div><div class="tile"><div class="label">기록 있는 학생</div><div class="v">${act.length}명</div></div><div class="tile"><div class="label">1인 평균 푼 시간</div><div class="v">${act.length?dur(tot/act.length):'-'}</div></div><div class="tile"><div class="label">반 전체 완료</div><div class="v">${rows.reduce((a,x)=>a+x.rec.exams.filter(e=>e.done).length,0)}개</div></div></div>
  <div class="tbl"><table class="ctable"><thead><tr><th>이름</th><th>공부한 날</th><th>총 푼 시간</th><th>완료 / 시작</th><th>평균 채점</th><th>마지막 공부</th></tr></thead><tbody>${rows.map(({r,rec})=>{const d=rec.exams.filter(e=>e.done);const avg=d.length?(d.reduce((a,e)=>a+e.attempts,0)/d.length).toFixed(1)+'회':'-';
    return `<tr data-k="${esc(key(r.cls,r.name))}" tabindex="0"><td><b>${esc(r.name)}</b></td><td>${rec.rows.length?Object.keys(rec.days).length+'일':'-'}</td><td>${rec.rows.length?dur(rec.total):'<span class="hint">기록 없음</span>'}</td><td>${d.length} / ${rec.exams.length}</td><td>${avg}</td><td>${rec.last?md(rec.last)+' '+hm(rec.last):'-'}</td></tr>`}).join('')}</tbody></table></div>
  <p class="hint" style="margin:0">학생 이름을 누르면 그 학생의 자세한 기록과 학부모 요약문이 나와요.</p>`;
  det.querySelectorAll('tr[data-k]').forEach(tr=>{const go=()=>{sel=tr.dataset.k;renderMain()};tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter')go()}});
  attachWrongTab(det,(panel,CC)=>buildClassWrong(panel,mem,recs,CC));
}

function dayStrip(rec){const out=[];const a=new Date(from+'T00:00'),b=new Date(to+'T00:00');
  for(let d=new Date(a);d<=b&&out.length<62;d.setDate(d.getDate()+1)){const k=ymd(d),s=rec.days[k]||0;const lv=!s?'':s<900?'l1':s<2700?'l2':'l3';
    out.push(`<span class="day ${lv}" title="${md(d)} ${dur(s)}">${d.getDate()}</span>`)}return out.join('')}

function renderDetail(det,c,n,rec){
  const done=rec.exams.filter(e=>e.done);
  const avg=done.length?(done.reduce((a,e)=>a+e.attempts,0)/done.length).toFixed(1):'-';
  const tk=Object.entries(rec.tally).sort((a,b)=>b[1]-a[1]);
  det.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${esc(c)} ${esc(n)}</h2><span class="hint">${md(from)} ~ ${md(to)}</span></div>
  <div class="tiles"><div class="tile"><div class="label">공부한 날</div><div class="v">${Object.keys(rec.days).length}일</div></div><div class="tile"><div class="label">총 푼 시간</div><div class="v">${dur(rec.total)}</div></div><div class="tile"><div class="label">완료한 시험</div><div class="v">${done.length} / ${rec.exams.length}</div></div><div class="tile"><div class="label">평균 채점 횟수</div><div class="v">${avg}회</div></div></div>
  <div><div class="label" style="margin-bottom:6px">날짜별 공부량</div><div class="days">${dayStrip(rec)}</div><p class="hint" style="margin:4px 0 0">색이 진할수록 오래 공부한 날이에요 (15분 · 45분 기준).</p></div>
  <div><div class="label" style="margin-bottom:6px">시험별 기록</div>${rec.exams.length?`<div class="tbl"><table><thead><tr><th>시험</th><th>처음 시작</th><th>결과</th><th>채점</th><th>처음 틀린 수</th><th>푼 시간</th><th>보고서</th></tr></thead><tbody>${rec.exams.map(e=>`<tr><td>${esc(e.title)}</td><td>${md(e.first)} ${hm(e.first)}</td><td>${e.done?`<span class="chip ok">${md(e.done)} ${hm(e.done)} 완료</span>`:'<span class="chip warn">진행 중</span>'}</td><td>${e.attempts||0}회</td><td>${e.firstWrong==null?'-':e.firstWrong+'개 / '+(e.total||'?')}</td><td>${dur(e.runSec||e.time)}</td><td>${e.done?`<div class="rbtns"><button class="btn small" data-rep="${esc(e.id)}">보고서 PDF</button><button class="btn small kbtn" data-kak="${esc(e.id)}">카톡</button></div>`:'-'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="hint">이 기간에 푼 시험이 없어요.</p>'}</div>
  ${tk.length?`<div><div class="label" style="margin-bottom:6px">자주 한 실수 (AI 분석 기준)</div><div class="tally">${tk.map(([k,v])=>`<div class="trow"><span>${esc(k)}</span><span class="tbar"><i style="width:${Math.round(v/tk[0][1]*100)}%"></i></span><b>${v}번</b></div>`).join('')}</div></div>`:''}
  <div><div class="label" style="margin-bottom:6px">오답노트</div><div class="tlist" id="notelist"></div></div>
  <div><div class="label" style="margin-bottom:6px">공부한 순서대로</div><div class="timeline"></div></div>
  <div class="field"><label class="label" for="pmsg">학부모님께 보낼 요약문</label><div class="row"><input type="text" id="acad" placeholder="학원 이름" value="${esc(ls.get('dabogi.t.acad','페르마 수학학원'))}" style="flex:1 1 200px"><input type="text" id="cmt" placeholder="선생님 한마디 (선택)" style="flex:2 1 260px"></div>
  <div class="opts" id="opts"><span class="lbl">요약문에 넣을 내용 · 체크한 것만 들어가요</span>${OPTS.map(o=>`<label class="opt"><input type="checkbox" data-k="${o[0]}" ${popt[o[0]]?'checked':''}><span>${o[1]}</span></label>`).join('')}</div><textarea id="pmsg"></textarea><div class="row"><button class="btn" id="copy">요약문 복사</button><button class="btn kbtn" id="ksum">요약문 카카오톡 보내기</button><span class="hint">복사한 뒤 카카오톡이나 문자에 붙여 넣으세요. 보내기 전에 내용을 고쳐도 돼요.</span></div></div>`;
  attachWrongTab(det,(panel,CC)=>buildStudentWrong(panel,rec,CC));
  det.querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>makeReportPdf(c,n,rec.exams.find(e=>e.id===b.dataset.rep),b));
  det.querySelectorAll('[data-kak]').forEach(b=>b.onclick=()=>kakaoResult(c,n,rec.exams.find(e=>e.id===b.dataset.kak)));
  det.querySelector('#ksum').onclick=()=>kakaoText(det.querySelector('#pmsg').value);
  const nl=det.querySelector('#notelist'),nts=notesOf(c,n);
  if(!nts.length)nl.innerHTML='<p class="hint" style="margin:0">아직 만든 오답노트가 없어요.</p>';
  nts.forEach(nt=>{const it=h(`<div class="titem"><div><strong>${md(nt.at)} ${hm(nt.at)}</strong> <span class="hint">${esc(nt.title)} · ${nt.keys.length+(nt.bt||[]).length}문제${(nt.bt||[]).length?` (블라인드 ${nt.bt.length}개 포함)`:''}</span></div><div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn small" data-m="q">문제지 PDF</button><button class="btn small ghost" data-m="a">빠른정답 PDF</button></div></div>`);
    it.querySelectorAll('button').forEach(b=>b.onclick=e=>makeNotePdf(c,n,nt,e.currentTarget,b.dataset.m));nl.appendChild(it)});
  const tl=det.querySelector('.timeline');const byDay={};
  rec.sessions.forEach(s=>{(byDay[ymd(s.start)]=byDay[ymd(s.start)]||[]).push(s)});
  const dk=Object.keys(byDay).sort().reverse();
  if(!dk.length)tl.innerHTML='<p class="hint">기록이 없어요.</p>';
  dk.forEach(d=>{const ss=byDay[d];const g=h(`<div class="dgroup"><div class="dhead"><span>${md(ss[0].start)}</span><span class="hint">${dur(ss.reduce((a,s)=>a+s.active,0))}</span></div></div>`);
    ss.forEach(s=>{const ev=s.events.filter(e=>e.ev==='attempt'||e.ev==='done').map(e=>`<span class="${e.ev==='done'?'done':''}">${hm(e.at)} ${e.attempt}차 ${e.ev==='done'?'다 맞음':`틀림 ${e.wrongCount}개${e.wrong?' ('+esc(e.wrong)+'번)':''}`}</span>`).join('');
      g.appendChild(h(`<div class="sess"><span class="when">${hm(s.start)}–${hm(s.end)}</span><div><strong>${esc(s.exam)}</strong> <span class="hint">화면을 보고 있던 시간 ${dur(s.active)}</span><div class="ev">${ev||'<span>채점 없이 시험지만 봄</span>'}</div></div></div>`))});
    tl.appendChild(g)});
  const make=()=>{const acad=det.querySelector('#acad').value.trim(),cmt=det.querySelector('#cmt').value.trim(),o=popt;
    const dayKeys=Object.keys(rec.days).sort();
    const L=[];L.push(`${acad?'['+acad+'] ':''}${n} 학생 학습 기록 (${md(from)} ~ ${md(to)})`);L.push('');
    if(o.days)L.push(`· 공부한 날: ${dayKeys.length}일${o.dates&&dayKeys.length?' ('+dayKeys.map(k=>md(k+'T00:00')).join(', ')+')':''}`);
    else if(o.dates&&dayKeys.length)L.push(`· 공부한 날짜: ${dayKeys.map(k=>md(k+'T00:00')).join(', ')}`);
    if(o.time)L.push(`· 문제를 푼 시간: 모두 ${dur(rec.total)}`);
    if(o.count)L.push(`· 완료한 시험: ${done.length}개${rec.exams.length>done.length?` (시작했지만 아직 못 끝낸 시험 ${rec.exams.length-done.length}개)`:''}`);
    if(o.exams&&rec.exams.length){if(!o.count)L.push('· 푼 시험');
      rec.exams.forEach(e=>{const bits=[e.done?(o.examDate?`${md(e.done)} 완료`:'완료'):'진행 중'];
        if(o.attempts&&e.done)bits.push(`${e.attempts}번 채점 만에 모두 맞힘`);
        if(o.first&&e.firstWrong!=null)bits.push(`처음 채점에서 ${e.firstWrong}문항 틀림`);
        if(o.examTime)bits.push(dur(e.runSec||e.time));
        L.push(`  - ${e.title}: ${bits.join(', ')}`)})}
    if(o.tally&&tk.length)L.push(`· 자주 한 실수: ${tk.slice(0,3).map(([k,v])=>`${k} ${v}번`).join(', ')}`);
    if(o.method){L.push('');L.push('틀린 문제를 알려주지 않고, 스스로 처음부터 다시 검토해서 모두 맞힐 때까지 푸는 방식으로 공부했어요.')}
    if(cmt){L.push('');L.push('선생님 한마디: '+cmt)}
    if(L.length<=2)L.push('(위에서 넣을 내용을 하나 이상 체크해 주세요)');
    det.querySelector('#pmsg').value=L.join('\n')};
  make();
  det.querySelector('#acad').oninput=e=>{ls.set('dabogi.t.acad',e.target.value);make()};
  det.querySelector('#cmt').oninput=make;
  det.querySelector('#opts').onchange=e=>{const k=e.target.dataset.k;if(!k)return;popt[k]=e.target.checked;ls.set('dabogi.t.opts',JSON.stringify(popt));make()};
  det.querySelector('#copy').onclick=async()=>{const ta=det.querySelector('#pmsg');try{await navigator.clipboard.writeText(ta.value);toast('복사했어요')}catch(e){ta.focus();ta.select();try{document.execCommand('copy');toast('복사했어요')}catch(_){toast('글자를 길게 눌러 직접 복사해 주세요')}}};
}

/* ---------- 실시간 통과 알림 ---------- */
let seen=0,liveTimer=null,audioCtx=null,pending=false,unread=0;
const passed=[];
const maxRecv=rows=>rows.reduce((m,r)=>Math.max(m,Number(r.recv)||0),0);
function isToday(t){return ymd(t)===ymd(Date.now())}
function doneInfo(r){const x=J(r.extra)||{};return {cls:r.cls,name:r.name,exam:r.examTitle,attempt:Number(r.attempt)||0,sec:x.runSec||Number(r.activeSec)||0,at:r.at}}
function initLive(){
  if(!seen){seen=maxRecv(DATA.rows);passed.length=0;
    DATA.rows.filter(r=>r.ev==='done'&&isToday(r.at)).sort((a,b)=>b.at-a.at).forEach(r=>passed.push(doneInfo(r)))}
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  clearInterval(liveTimer);liveTimer=setInterval(poll,20000);renderLive();
}
function chime(){if(!audioCtx||ls.get('dabogi.t.sound','1')!=='1')return;try{audioCtx.resume();const t=audioCtx.currentTime;
  [[880,0],[1318.5,.18]].forEach(([f,d])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.25,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.6);o.connect(g).connect(audioCtx.destination);o.start(t+d);o.stop(t+d+.65)})}catch(e){}}
function popCard(p){const box=document.getElementById('pops')||document.body.appendChild(h('<div id="pops" class="pops" aria-live="polite"></div>'));
  const c=h(`<div class="pop"><div class="pt">통과했어요</div><div class="pn">${esc(p.cls)} <b>${esc(p.name)}</b></div><div class="pm">${esc(p.exam)} · ${p.attempt}번 채점 만에 · ${dur(p.sec)}</div><button class="px" aria-label="닫기">×</button></div>`);
  c.querySelector('.px').onclick=()=>c.remove();box.prepend(c);setTimeout(()=>c.classList.add('old'),60000)}
function sysNote(p){try{if('Notification' in window&&Notification.permission==='granted')new Notification(`${p.cls} ${p.name} 통과!`,{body:`${p.exam} · ${p.attempt}번 채점 만에 · ${dur(p.sec)}`,tag:'pass-'+p.name+p.at})}catch(e){}}
async function poll(){if(!DATA)return;
  try{const r=await(await fetch(EP+'?action=data&key='+encodeURIComponent(DATA.pw))).json();if(!r.ok)return;
    const fresh=r.rows.filter(x=>(Number(x.recv)||0)>seen);seen=Math.max(seen,maxRecv(r.rows));
    const pw=DATA.pw;DATA=r;DATA.pw=pw;
    const dones=fresh.filter(x=>x.ev==='done').map(doneInfo);
    dones.forEach(p=>{passed.unshift(p);popCard(p);sysNote(p)});
    if(dones.length){chime();if(document.hidden){unread+=dones.length;document.title=`(${unread}) 통과 · 블라인드 테스트 학습 기록`}}
    if(fresh.length){if(!sel)renderMain();else{pending=true;renderLive()}}else renderLive();
    document.querySelectorAll('.lv-time').forEach(e=>e.textContent=hm(Date.now()));
  }catch(e){}}
document.addEventListener('pointerdown',()=>{try{audioCtx&&audioCtx.resume()}catch(e){}},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){unread=0;document.title='블라인드 테스트 학습 기록'}});
function renderLive(){const el=document.getElementById('live');if(!el)return;
  const notif='Notification' in window?Notification.permission:'unsupported';
  el.innerHTML=`<div class="row" style="justify-content:space-between"><div><span class="dot-live"></span><strong>실시간 알림 켜짐</strong> <span class="hint">20초마다 확인 · 마지막 확인 <span class="lv-time">${hm(Date.now())}</span></span></div>
    <div class="row" style="gap:6px">${pending?'<button class="btn small" id="lvnew">새 기록 반영하기</button>':''}<label class="row hint" style="gap:4px"><input type="checkbox" id="lvsound" style="width:auto" ${ls.get('dabogi.t.sound','1')==='1'?'checked':''}> 소리</label>${notif==='default'?'<button class="btn ghost small" id="lvperm">컴퓨터 알림도 받기</button>':notif==='denied'?'<span class="hint">컴퓨터 알림이 브라우저에서 막혀 있어요</span>':''}</div></div>
    <div class="label" style="margin-top:6px">오늘 통과한 학생 ${passed.filter(p=>isToday(p.at)).length}명</div>
    <div class="passlist">${passed.filter(p=>isToday(p.at)).map(p=>`<span class="pchip"><b>${esc(p.name)}</b> ${esc(p.cls)} · ${hm(p.at)} · ${p.attempt}회</span>`).join('')||'<span class="hint">아직 없어요. 학생이 통과하면 여기에 바로 나타나요.</span>'}</div>`;
  const nb=el.querySelector('#lvnew');if(nb)nb.onclick=()=>{pending=false;renderMain()};
  el.querySelector('#lvsound').onchange=e=>{ls.set('dabogi.t.sound',e.target.checked?'1':'0');if(e.target.checked){try{audioCtx&&audioCtx.resume()}catch(_){}chime()}};
  const pb=el.querySelector('#lvperm');if(pb)pb.onclick=async()=>{try{await Notification.requestPermission()}catch(e){}renderLive()};
}

const saved=ls.get('dabogi.t.pw','');
if(saved)load(saved,true);else renderLogin();
})();
</script>
